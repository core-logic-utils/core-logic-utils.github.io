<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabspace</title>
    <link rel="icon" href="https://core-logic-utils.github.io/assets/tabspacelogo.png">
    <meta name="description" content="Tabspace — a streamlined productivity and organization tool.">
    <meta property="og:title" content="Tabspace">
    <meta property="og:type" content="website">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --bg: #0b0506;
        --panel: #1a0d0f;
        --panel-2: #241216;
        --border: #3a1a1f;
        --accent: #ef4444;
        --accent-dark: #b91c1c;
        --accent-rgb: 239, 68, 68;
        --accent-dark-rgb: 185, 28, 28;
        --panel-rgb: 26, 13, 15;
        --bg-rgb: 11, 5, 6;
        --accent-light: #fca5a5;
        --muted: #8b6f73;
        --panel-hover: rgba(60, 20, 26, 0.9);
        --on-accent: #fff;
        --accent-glow: rgba(var(--accent-rgb), 0.35);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        font-family: 'Inter', sans-serif;
        color: white;
        overflow-x: hidden;
    }

    /* ---------- Interactive background ---------- */
    #bg-canvas {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0; pointer-events: none;
    }

    /* ---------- Home screen ---------- */
    #home {
        position: relative; z-index: 1;
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        text-align: center;
        padding: 24px;
        transition: opacity .35s ease, transform .35s ease;
    }
    #home img {
        width: 150px; height: 150px; object-fit: contain;
        filter: drop-shadow(0 0 28px var(--accent-glow));
        animation: float 5s ease-in-out infinite;
    }
    #home h1 {
        margin: 18px 0 0;
        font-size: 4rem; font-weight: 700; letter-spacing: -0.02em;
        background: linear-gradient(180deg, #fff 30%, var(--accent-light) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    body.games-open #home { opacity: 0; transform: scale(.97); pointer-events: none; }

    /* ---------- Search bar (top middle) ---------- */
    #search-wrap {
        position: fixed; top: 18px; left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        width: min(460px, calc(100vw - 150px));
        opacity: 0; pointer-events: none;
        transform: translateX(-50%) translateY(-8px);
        transition: opacity .3s ease, transform .3s ease;
    }
    body.games-open #search-wrap {
        opacity: 1; pointer-events: auto;
        transform: translateX(-50%);
    }
    #search-wrap i {
        position: absolute; left: 16px; top: 50%;
        transform: translateY(-50%);
        color: #a1a1aa; font-size: .9rem; pointer-events: none;
    }
    #search {
        width: 100%;
        background: rgba(var(--panel-rgb), 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        color: white; font: inherit; font-size: .95rem;
        padding: 11px 16px 11px 42px;
        border-radius: 999px; outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    #search::placeholder { color: var(--muted); }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* ---------- Games view ---------- */
    #games-view {
        position: fixed; inset: 0; z-index: 10;
        overflow-y: auto;
        padding: 84px 24px 110px;
        opacity: 0; pointer-events: none;
        transform: translateY(14px);
        transition: opacity .35s ease, transform .35s ease;
    }
    body.games-open #games-view { opacity: 1; pointer-events: auto; transform: none; }

    #home-btn {
        position: fixed; top: 18px; left: 18px; z-index: 60;
        display: none; align-items: center; gap: 8px;
        background: rgba(var(--panel-rgb), 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        color: white; font: inherit; font-size: .85rem; font-weight: 500;
        padding: 10px 14px; border-radius: 999px; cursor: pointer;
        transition: border-color .2s, background .2s;
    }
    #home-btn:hover { border-color: var(--accent); background: var(--panel-hover); }
    body.games-open #home-btn { display: flex; }

    #games-grid {
        max-width: 1400px; margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 12px;
    }
    #no-results {
        display: none; text-align: center; color: var(--muted); margin-top: 60px;
    }

    /* Smaller game blocks */
    .game-block {
        background: var(--panel);
        border-radius: 12px;
        overflow: hidden; cursor: pointer;
        border: 1px solid var(--border);
        transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .game-block:hover {
        transform: translateY(-4px) scale(1.04);
        border-color: var(--accent);
        box-shadow: 0 10px 22px -6px rgba(0,0,0,.6), 0 0 16px var(--accent-glow);
    }
    .game-block img {
        width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
        background: var(--panel-2);
        transition: transform .35s ease;
    }
    .game-block:hover img { transform: scale(1.08); }
    .game-block p {
        margin: 0; padding: 7px 6px;
        text-align: center; font-size: .72rem; font-weight: 500; line-height: 1.25;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; min-height: 2.6em;
    }

    /* ---------- Launcher (controller button + dropdown) ---------- */
    #launcher {
        position: fixed; left: 20px; bottom: 20px; z-index: 70;
        transition: opacity .25s ease, transform .25s ease;
    }
    body.in-game #launcher { opacity: 0; pointer-events: none; transform: scale(.8); visibility: hidden; }

    #launcher-btn {
        width: 54px; height: 54px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(145deg, var(--accent), var(--accent-dark));
        color: var(--on-accent); font-size: 1.4rem;
        border: none; border-radius: 16px; cursor: pointer;
        box-shadow: 0 6px 18px rgba(var(--accent-dark-rgb), .45);
        transition: transform .2s ease, box-shadow .2s ease;
    }
    #launcher:hover #launcher-btn, #launcher.open #launcher-btn {
        transform: translateY(-2px) scale(1.06);
        box-shadow: 0 10px 26px var(--accent-glow);
    }

    /* The menu sits directly above the button. The padding-bottom acts as a
       hover bridge so the menu doesn't vanish while the mouse crosses the gap. */
    #menu-wrap {
        position: absolute; left: 0; bottom: 100%;
        padding-bottom: 10px;
        opacity: 0; visibility: hidden;
        transform: translateY(10px) scale(.97);
        transform-origin: bottom left;
        transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    #launcher:hover #menu-wrap, #launcher.open #menu-wrap {
        opacity: 1; visibility: visible; transform: none;
    }
    #launcher.suppress #menu-wrap { opacity: 0; visibility: hidden; }

    .menu {
        min-width: 210px;
        background: rgba(var(--panel-rgb), 0.95);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 16px; padding: 6px;
        box-shadow: 0 18px 40px rgba(0,0,0,.6);
    }
    .menu-item {
        position: relative;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 12px; border-radius: 10px;
        font-size: .92rem; font-weight: 500;
        cursor: pointer; user-select: none;
        transition: background .15s ease;
    }
    .menu-item:hover { background: rgba(var(--accent-rgb), .18); }
    .menu-item .mi-icon { width: 20px; text-align: center; color: var(--accent); }
    .menu-item .mi-arrow { margin-left: auto; font-size: .7rem; color: var(--muted); }

    /* Chat 1 / Chat 2 fly-out */
    .submenu {
        position: absolute; left: 100%; bottom: -6px;
        padding-left: 8px;
        opacity: 0; visibility: hidden;
        transform: translateX(-6px);
        transition: opacity .15s ease, transform .15s ease, visibility .15s;
    }
    .menu-item.has-sub:hover > .submenu,
    .menu-item.has-sub.sub-open > .submenu {
        opacity: 1; visibility: visible; transform: none;
    }

    /* ---------- Game player ---------- */
    #game-container {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: black; z-index: 9998; display: none;
    }
    #game-frame { border: none; width: 100vw; height: 100vh; display: block; }
    #back-btn {
        position: fixed; top: 14px; left: 14px; z-index: 9999;
        width: 42px; height: 42px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(var(--accent-rgb), 0.22);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(var(--accent-rgb), 0.35);
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        border-radius: 12px; cursor: pointer;
        transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    #back-btn:hover {
        background: rgba(var(--accent-rgb), 0.55);
        transform: translateX(-2px);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.35);
    }

    @media (max-width: 640px) {
        #home h1 { font-size: 2.8rem; }
        #home img { width: 110px; height: 110px; }
        #games-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
    }


    /* =====================================================================
       Tabspace additions: customization, accounts, sync status
       ===================================================================== */
    [hidden] { display: none !important; }
    #bg-image { position: fixed; inset: 0; z-index: 0; display: none; background: center / cover no-repeat; pointer-events: none; }
    #bg-image::after { content: ""; position: absolute; inset: 0; background: rgba(var(--bg-rgb), .38); }

    #ts-top { position: fixed; top: 18px; right: 18px; z-index: 61; display: flex; align-items: center; gap: 10px; }
    body.in-game #ts-top, body.in-game #cust-panel { display: none; }
    #cust-btn {
        width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
        background: rgba(var(--panel-rgb), .8); backdrop-filter: blur(10px);
        border: 1px solid var(--border); color: #fff; border-radius: 999px; cursor: pointer;
        transition: border-color .2s, background .2s;
    }
    #cust-btn:hover, #cust-btn[aria-expanded="true"] { border-color: var(--accent); background: var(--panel-hover); }
    #ts-status {
        display: flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px;
        font: inherit; font-size: .75rem; font-weight: 500; color: #d4d4d8;
        background: rgba(var(--panel-rgb), .8); backdrop-filter: blur(10px);
        border: 1px solid var(--border); border-radius: 999px; cursor: default; transition: opacity .4s;
    }
    #ts-status[hidden] { display: none; }
    #ts-status.ok i { color: #4ade80; }
    #ts-status.bad { cursor: pointer; border-color: #f59e0b; }
    #ts-status.bad i { color: #f59e0b; }
    #ts-status.quiet { opacity: .55; }
    #ts-status.quiet span { display: none; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    #cust-panel {
        position: fixed; top: 70px; right: 18px; z-index: 62;
        width: min(340px, calc(100vw - 24px)); max-height: calc(100vh - 90px); overflow: auto;
        background: rgba(var(--panel-rgb), .96); backdrop-filter: blur(14px);
        border: 1px solid var(--border); border-radius: 16px; padding: 16px;
        box-shadow: 0 18px 40px rgba(0,0,0,.6);
    }
    #cust-panel[hidden] { display: none; }
    .ts-ph { display: flex; flex-direction: column; gap: 2px; margin-bottom: 14px; }
    .ts-ph strong { font-size: 1rem; }
    .ts-sec { margin-bottom: 16px; }
    .ts-lab { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 8px; color: #e4e4e7; }
    .ts-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ts-note { font-size: .78rem; color: var(--muted); margin: 0; }
    .ts-err { min-height: 1em; margin: 6px 0 0; font-size: .78rem; color: #fca5a5; }
    #c-picker { width: 44px; height: 38px; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: none; cursor: pointer; }
    .ts-input, #c-hex {
        flex: 1; min-width: 0; background: rgba(0,0,0,.28); border: 1px solid var(--border); color: #fff;
        font: inherit; font-size: .92rem; padding: 10px 12px; border-radius: 10px;
    }
    #c-hex.bad { border-color: #f87171; }
    .ts-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        font: inherit; font-size: .88rem; font-weight: 600; color: #fff; cursor: pointer;
        background: rgba(255,255,255,.06); border: 1px solid var(--border);
        padding: 10px 14px; border-radius: 10px; transition: border-color .2s, background .2s, opacity .2s;
    }
    .ts-btn:hover:not(:disabled) { border-color: var(--accent); }
    .ts-btn:disabled { opacity: .6; cursor: default; }
    .ts-btn.primary { background: linear-gradient(145deg, var(--accent), var(--accent-dark)); color: var(--on-accent); border-color: transparent; }
    .ts-btn.danger { width: 100%; color: #fca5a5; }
    .ts-link { background: none; border: none; padding: 0; font: inherit; font-size: .8rem; color: var(--accent-light); cursor: pointer; text-decoration: underline; }
    .ts-tog { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .85rem; font-weight: 500; margin-left: auto; }
    .ts-tog input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .ts-knob { width: 38px; height: 22px; border-radius: 999px; background: #3f3f46; position: relative; transition: background .2s; flex: none; }
    .ts-knob::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .ts-tog input:checked + .ts-knob { background: var(--accent); }
    .ts-tog input:checked + .ts-knob::after { transform: translateX(16px); }
    .ts-tog input:focus-visible + .ts-knob { outline: 2px solid var(--accent); outline-offset: 2px; }
    .ts-prev { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
    #c-thumb { width: 64px; height: 44px; border-radius: 8px; border: 1px solid var(--border); background: center / cover no-repeat; flex: none; }
    .ts-pinfo { display: flex; flex-direction: column; gap: 4px; font-size: .78rem; color: #d4d4d8; min-width: 0; }
    .ts-prev[hidden] { display: none; }

    /* Overlays: sign-in screen and dialogs */
    .ts-overlay {
        position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center; padding: 20px;
        background: rgba(var(--bg-rgb), .93); backdrop-filter: blur(6px); overflow-y: auto;
    }
    .ts-overlay[hidden] { display: none; }
    #ts-dialog { z-index: 10010; background: rgba(0,0,0,.6); }
    .ts-card {
        width: min(400px, 100%); background: var(--panel); border: 1px solid var(--border);
        border-radius: 20px; padding: 26px 24px; box-shadow: 0 24px 60px rgba(0,0,0,.6);
    }
    .ts-card h2, .ts-card h3 { margin: 0 0 6px; font-weight: 700; }
    .ts-card h2 { font-size: 1.4rem; }
    .ts-card p { margin: 0 0 14px; font-size: .9rem; color: #d4d4d8; line-height: 1.45; }
    .ts-logo { display: block; width: 64px; height: 64px; object-fit: contain; margin: 0 auto 12px; filter: drop-shadow(0 0 18px var(--accent-glow)); }
    .ts-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: rgba(0,0,0,.28); padding: 4px; border-radius: 12px; margin: 14px 0; }
    .ts-tabs button { font: inherit; font-weight: 600; font-size: .88rem; color: #a1a1aa; background: none; border: none; padding: 9px; border-radius: 9px; cursor: pointer; }
    .ts-tabs button.on { background: var(--panel-2); color: #fff; box-shadow: inset 0 0 0 1px var(--border); }
    #auth-form label { display: block; font-size: .8rem; font-weight: 600; margin-bottom: 12px; color: #e4e4e7; }
    #auth-form .ts-input { display: block; width: 100%; margin-top: 6px; }
    #auth-form .ts-btn, #auth-retry { width: 100%; margin-top: 4px; }
    #auth-boot { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px 0 6px; color: #d4d4d8; }
    #auth-guest { display: block; margin: 16px auto 0; font-size: .88rem; }
    #d-btns { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 18px; }

    /* Sign-out button: appears directly to the right of the menu button */
    #ts-so-wrap {
        position: absolute; left: 100%; bottom: 0; height: 54px; padding-left: 10px;
        display: flex; align-items: center;
        opacity: 0; visibility: hidden; transform: translateX(-8px);
        transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    #launcher:hover #ts-so-wrap, #launcher.open #ts-so-wrap { opacity: 1; visibility: visible; transform: none; }
    #launcher.suppress #ts-so-wrap { opacity: 0; visibility: hidden; }
    .ts-so {
        width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
        background: rgba(var(--panel-rgb), .95); backdrop-filter: blur(14px);
        border: 1px solid var(--border); border-radius: 12px; color: #fff; cursor: pointer; font-size: .95rem;
        transition: border-color .2s, color .2s;
    }
    .ts-so:hover { border-color: var(--accent); color: var(--accent-light); }

    @media (max-width: 640px) { #ts-status span { display: none; } #ts-status { padding: 0 10px; } }
    @media (prefers-reduced-motion: reduce) { .ts-knob, .ts-knob::after, #ts-so-wrap { transition: none; } }
</style>
</head>
<body>
    <!-- Interactive particle background -->
    <div id="bg-image"></div>
    <canvas id="bg-canvas"></canvas>

    <!-- Search bar (top middle) -->
    <div id="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="text" placeholder="Search games..." autocomplete="off" spellcheck="false">
    </div>
    <button id="home-btn" onclick="closeGamesView()"><i class="fa-solid fa-house"></i> Home</button>

    <!-- Home screen: just the name + logo -->
    <div id="home">
        <img src="https://core-logic-utils.github.io/assets/tabspacelogo.png" alt="Tabspace logo">
        <h1>Tabspace</h1>
    </div>

    <!-- Games view (filled from the GAMES list below) -->
    <div id="games-view">
        <div id="games-grid"></div>
        <p id="no-results">No games found.</p>
    </div>

    <!-- Controller button + upward dropdown (menu filled from MENU_ITEMS below) -->
    <div id="launcher">
        <div id="menu-wrap"><div class="menu" id="menu"></div></div>
        <button id="launcher-btn" aria-label="Menu"><i class="fa-solid fa-gamepad"></i></button>
        <div id="ts-so-wrap"><button id="ts-so" class="ts-so" type="button" aria-label="Sign out"><i class="fa-solid fa-right-from-bracket"></i></button></div>
    </div>

    <!-- Customize button (top right) + sync status -->
    <div id="ts-top">
        <button id="ts-status" type="button" hidden></button>
        <button id="cust-btn" type="button" aria-label="Customize" aria-expanded="false" aria-controls="cust-panel"><i class="fa-solid fa-sliders"></i></button>
    </div>

    <!-- Customization panel -->
    <div id="cust-panel" role="dialog" aria-label="Customize Tabspace" hidden>
        <div class="ts-ph"><strong>Customize</strong><span id="c-who" class="ts-note"></span></div>
        <div class="ts-sec">
            <label class="ts-lab" for="c-hex">Theme color</label>
            <div class="ts-row">
                <input type="color" id="c-picker" aria-label="Color picker">
                <input id="c-hex" type="text" maxlength="7" spellcheck="false" autocomplete="off" placeholder="#EF4444" aria-describedby="c-hexerr">
            </div>
            <p id="c-hexerr" class="ts-err" role="alert"></p>
        </div>
        <div class="ts-sec">
            <span class="ts-lab">Background</span>
            <div class="ts-row">
                <button type="button" class="ts-btn" id="c-upload"><i class="fa-solid fa-image"></i> Upload image</button>
                <label class="ts-tog"><input type="checkbox" id="c-fx" role="switch"><span class="ts-knob"></span><span>Interactive effect</span></label>
            </div>
            <input type="file" id="c-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
            <div id="c-prev" class="ts-prev" hidden>
                <div id="c-thumb"></div>
                <div class="ts-pinfo"><span id="c-pinfo"></span>
                    <div class="ts-row"><button type="button" class="ts-link" id="c-sync" hidden>Upload to my account</button><button type="button" class="ts-link" id="c-remove">Remove image</button></div>
                </div>
            </div>
            <p id="c-err" class="ts-err" role="alert"></p>
        </div>
        <button type="button" class="ts-btn danger" id="c-reset"><i class="fa-solid fa-rotate-left"></i> Reset customization</button>
    </div>

    <!-- Sign-in / sign-up screen (visible while the session is being restored) -->
    <div id="auth" class="ts-overlay" role="dialog" aria-modal="true" aria-labelledby="auth-title">
        <div class="ts-card">
            <img class="ts-logo" src="https://core-logic-utils.github.io/assets/tabspacelogo.png" alt="">
            <h2 id="auth-title" style="text-align:center">Tabspace</h2>
            <div id="auth-boot"><i class="fa-solid fa-spinner fa-spin"></i><span id="auth-boot-text">Restoring your session…</span></div>
            <div id="auth-main" hidden>
                <div class="ts-tabs" role="tablist">
                    <button type="button" id="tab-in" role="tab" class="on" aria-selected="true">Sign in</button>
                    <button type="button" id="tab-up" role="tab" aria-selected="false">Sign up</button>
                </div>
                <form id="auth-form" novalidate>
                    <label>Username<input class="ts-input" id="a-user" autocomplete="username" maxlength="20" spellcheck="false" autocapitalize="none"></label>
                    <label>Password<input class="ts-input" id="a-pass" type="password" autocomplete="current-password" maxlength="128"></label>

    function launchGame(url) {
        if (window.TS) TS.onLaunch(url, false);
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        document.body.classList.add('in-game');
        if (loading) loading.style.display = 'none';

        // clean previous blob if any
        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.removeAttribute('srcdoc');
        frame.setAttribute('data-no-proxy', 'true');
        frame.src = url;

        frame.style.display = 'block';
        container.style.display = 'block';
    }

    async function launchProxGame(url) {
        if (window.TS) TS.onLaunch(url, true);
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        document.body.classList.add('in-game');
        container.style.display = 'block';
        frame.style.display = 'none';
        if (loading) {
            loading.style.display = 'block';
            loading.innerText = 'Loading...';
        }

        // clean previous blob
        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.removeAttribute('srcdoc');

        // KEEP the opt-out so the parent interceptor does not rewrite the blob URL
        frame.setAttribute('data-no-proxy', 'true');

        const relayBase = "https://network-aqzh.onrender.com";
        const proxyUrl = relayBase + "/api/relay?url=" + encodeURIComponent(url);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Proxy returned ' + response.status);

            const html = await response.text();

            const blob = new Blob([html], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);

            frame._blobUrl = blobUrl;
            frame.src = blobUrl;               // now protected by data-no-proxy

            frame.onload = function() {
                if (loading) loading.style.display = 'none';
                frame.style.display = 'block';
            };
        } catch (err) {
            console.error(err);
            if (loading) loading.innerText = 'Failed to load.';
        }
    }

    function closeGame() {
        if (window.TS) TS.onClose();
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        container.style.display = 'none';

            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.src = '';
        frame.removeAttribute('srcdoc');
        frame.removeAttribute('data-no-proxy');
        if (loading) loading.style.display = 'none';
    }

                    games.slice(i).forEach((g) => this.pdirty.add(g));
                    if (e.status === 401) { sessionExpired(); return false; }
                    this.fails++; setStatus(e.net ? 'offline' : 'failed');
                    this.schedule(Math.min(60000, 5000 * Math.pow(2, this.fails - 1)), true);
                    return false;
                }
                this.fails = 0;
                if (this.dirty.size || this.pdirty.size) { this.schedule(1500, true); return true; }
                setStatus('saved'); return true;
            }
        };

        const STAT = {
            saved: ['fa-circle-check', 'Saved', 'ok'], saving: ['fa-spinner fa-spin', 'Saving…', ''],
            failed: ['fa-triangle-exclamation', 'Save failed · retry', 'bad'], offline: ['fa-wifi', 'Offline · will sync', 'bad'], local: ['fa-cloud', 'Not synced', 'bad']
        };
        let quietT = null;
        function setStatus(k) {
            Cloud.status = k;
            const b = $('ts-status');
            if (!Cloud.user) { b.hidden = true; return; }
            const [ic, tx, cl] = STAT[k] || STAT.local;
            b.hidden = false; b.className = cl; b.title = tx;
            b.innerHTML = `<i class="fa-solid ${ic}"></i><span>${tx}</span>`;
            clearTimeout(quietT);
            if (k === 'saved') quietT = setTimeout(() => b.classList.add('quiet'), 2500);
        }
        $('ts-status').addEventListener('click', () => {
            if (!Cloud.user || !/bad/.test($('ts-status').className)) return;
            if (!Cloud.reconciled) enterAccount(); else Cloud.flush();
        });

        // ---------- game progress ----------
        function backup(id, data, reason) {
            const a = LS.get(BAK, []); a.push({ id, data, t: Date.now(), reason }); while (a.length > 10) a.shift(); LS.set(BAK, a);
        }
        const gameName = (id) => { const g = GAMES.find((x) => gid(x.url) === id); return g ? g.name : id; };
        function gid(u) { try { const x = new URL(u); return (x.hostname + x.pathname).toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 120) || 'game'; } catch (e) { return 'game'; } }
        function saveGame(id, data) {
            const e = P[id];
            if (e && e.data === data) return;
            P[id] = { data, rev: e ? e.rev || 0 : 0, t: Date.now(), dirty: true };
            if (!LS.set(PK, P)) { setStatus('failed'); return; }
            if (Cloud.user) { Cloud.pdirty.add(id); Cloud.schedule(3000); }
        }
        async function pushGame(id) {
            const e = P[id];
            if (!e || !e.dirty) return;
            const sent = e.data;
            try {
                const r = await Cloud.api('/api/progress/' + encodeURIComponent(id), { method: 'PUT', body: { data: sent, baseRev: e.rev || 0, force: !!e.force } });
                const cur = P[id]; cur.rev = r.rev; cur.force = false;
                if (cur.data === sent) cur.dirty = false; else Cloud.pdirty.add(id);
                LS.set(PK, P);
            } catch (err) {
                if (err.status === 409 && err.json && err.json.current) { await resolveConflict(id, err.json.current); return; }
                if (err.status === 413) { e.dirty = false; LS.set(PK, P); dlg('Save too large to sync', gameName(id) + ' has a save bigger than the sync limit. It is kept on this device only.', [{ label: 'OK', v: 1, primary: true }]); return; }
                throw err;
            }
        }
        async function resolveConflict(id, c) {
            const l = P[id];
            const ch = await dlg('Progress differs for ' + gameName(id),
                'This device and your account both have saved progress for this game, and they don’t match. Whichever you don’t pick is kept as a backup. Device copy: ' + new Date(l.t).toLocaleString() + '. Account copy: ' + new Date(c.t).toLocaleString() + '.',
                [{ label: 'Use account’s progress', v: 'cloud' }, { label: 'Use this device’s progress', v: 'local', primary: true }], { noEsc: true });
            if (ch === 'cloud') { backup(id, l.data, 'replaced by account copy'); P[id] = { data: c.data, rev: c.rev, t: c.t, dirty: false }; }
            else { l.rev = c.rev; l.force = true; l.dirty = true; Cloud.pdirty.add(id); }
            LS.set(PK, P);
        }

        // postMessage bridge: a game opts in by posting {tabspace:1,type:'hello'|'save',data:'<string>'}
        let cur = null;
        window.addEventListener('message', (e) => {
            const f = $('game-frame');
            if (!cur || !f || e.source !== f.contentWindow || e.origin !== cur.origin) return;
            const m = e.data;
            if (!m || m.tabspace !== 1) return;
            if (m.type === 'hello' || m.type === 'load') {
                const en = P[cur.id];
                e.source.postMessage({ tabspace: 1, type: 'load', game: cur.id, data: en && en.data != null ? en.data : null }, e.origin === 'null' ? '*' : e.origin);
            } else if (m.type === 'save' && typeof m.data === 'string' && m.data.length <= 200000) saveGame(cur.id, m.data);
        });

        // ---------- sign-in reconciliation (never lets empty data erase real data) ----------
        async function reconcile(d) {
            const uid = Cloud.user.id, cs = d.settings || {}, cp = d.gameProgress || {};
            // another account's local progress is stashed, not deleted
            const owner = LS.get(POK, null);
            if (owner && owner !== uid) {
                const st = LS.get(STASH, {}); st[owner] = P; P = st[uid] || {}; delete st[uid]; LS.set(STASH, st); LS.set(PK, P);
            }
            // settings
            const same = LS.get(OWN, null) === uid, diff = [];
            for (const k of KEYS) {
                const c = cs[k], lt = S.t[k] || 0;
                if (!c) { if (lt > 0 && !(k === 'bgImage' && S.v.bgImage && S.v.bgImage.kind === 'local')) Cloud.dirty.add(k); continue; }
                const cv = fromCloud(k, c.v), ct = c.t || 0;
                if (cmpKey(S.v[k]) === cmpKey(cv)) { S.t[k] = Math.max(lt, ct); continue; }
                if (lt === 0 || (same && ct >= lt)) takeCloud(k, cv, ct);
                else if (same) Cloud.dirty.add(k);
                else diff.push([k, cv, ct]);
            }
            if (diff.length) {
                const ch = await dlg('Which customization should we keep?', 'This device has customization that differs from your account’s saved look.',
                    [{ label: 'Use my account’s', v: 'cloud' }, { label: 'Keep this device’s', v: 'local', primary: true }], { noEsc: true });
                diff.forEach(([k, cv, ct]) => {
                    if (ch === 'cloud') takeCloud(k, cv, ct);
                    else if (!(k === 'bgImage' && S.v.bgImage && S.v.bgImage.kind === 'local')) { S.t[k] = Math.max(S.t[k] || 0, ct + 1); Cloud.dirty.add(k); }
                });
            }
            saveS(); LS.set(OWN, uid);
            // game progress
            for (const id of new Set([...Object.keys(cp), ...Object.keys(P)])) {
                const c = cp[id], l = P[id];
                if (c && (!l || l.data == null)) { P[id] = { data: c.data, rev: c.rev, t: c.t, dirty: false }; continue; }
                if (!c) { if (l && l.data != null) { l.rev = 0; l.dirty = true; Cloud.pdirty.add(id); } continue; }
                if (c.data === l.data) { l.rev = c.rev; l.dirty = false; continue; }
                if (!l.dirty && l.rev > 0 && l.rev < c.rev) { P[id] = { data: c.data, rev: c.rev, t: c.t, dirty: false }; continue; }
                if (l.dirty && l.rev === c.rev) { Cloud.pdirty.add(id); continue; }
                await resolveConflict(id, c);
            }
            LS.set(PK, P); LS.set(POK, uid);
        }
        function takeCloud(k, cv, ct) {
            if (k === 'bgImage' && S.v.bgImage && S.v.bgImage.kind === 'local') idb('readwrite', (s) => s.delete('current')).catch(() => {});
            S.v[k] = cv; S.t[k] = ct;
        }

        // ---------- auth flow ----------
        let mode = 'in';
        function showBoot(t) { $('auth').hidden = false; $('auth-boot').hidden = false; $('auth-main').hidden = true; $('auth-boot-text').textContent = t; }
        function showAuth(msg, retry) {
            $('auth').hidden = false; $('auth-boot').hidden = true; $('auth-main').hidden = false;
            $('auth-retry').hidden = !retry; showErr('auth-err', msg || '');
            const off = !Cloud.ready();
            $('auth-submit').disabled = off;
            if (off) showErr('auth-err', 'Accounts aren’t set up on this copy of the site yet. You can continue as a guest.');
            setMode(mode); $('a-user').focus();
        }
        function setMode(m) {
            mode = m; const up = m === 'up';
            $('tab-in').classList.toggle('on', !up); $('tab-up').classList.toggle('on', up);
            $('tab-in').setAttribute('aria-selected', !up); $('tab-up').setAttribute('aria-selected', up);
            $('a-conf-wrap').hidden = !up; $('auth-submit').textContent = up ? 'Create account' : 'Sign in';
            $('a-pass').autocomplete = up ? 'new-password' : 'current-password';
        }
        $('tab-in').onclick = () => { setMode('in'); showErr('auth-err', ''); };
        $('tab-up').onclick = () => { setMode('up'); showErr('auth-err', ''); };
        const authMsg = (e) => e.cfg ? e.message : e.net ? 'Can’t reach the account server. Check your connection and try again.'
            : e.status === 401 ? 'Incorrect username or password.' : e.status === 409 ? 'That username is already taken.'
            : e.status === 429 ? 'Too many attempts. Wait a few minutes and try again.' : e.message || 'Something went wrong.';
        $('auth-form').addEventListener('submit', async (ev) => {
            ev.preventDefault();
            const u = $('a-user').value.trim(), p = $('a-pass').value, up = mode === 'up';
            if (!/^[A-Za-z0-9_]{3,20}$/.test(u)) return showErr('auth-err', 'Username must be 3–20 letters, numbers or underscores.');
            if (p.length < 8 || p.length > 128) return showErr('auth-err', 'Password must be 8–128 characters.');
            if (up && p !== $('a-conf').value) return showErr('auth-err', 'Passwords don’t match.');
            const btn = $('auth-submit'), label = btn.textContent;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Please wait…'; showErr('auth-err', '');
            try {
                const r = await Cloud.api(up ? '/api/register' : '/api/login', { method: 'POST', body: { username: u, password: p } });
                Cloud.user = r.user; Cloud.token = r.token || null;
                $('a-pass').value = ''; $('a-conf').value = '';
                sessionStorage.removeItem(GUEST);
                await enterAccount();
            } catch (e) { showErr('auth-err', authMsg(e)); }
            finally { btn.disabled = !Cloud.ready(); btn.textContent = label; }
        });
        $('auth-retry').onclick = restore;
        $('auth-guest').onclick = async () => {
            const ok = await dlg('Continue as a guest?', 'Your game progress and customization may not carry over to other copies of this website or other devices. Creating an account lets you sync your data across supported copies.',
                [{ label: 'Go Back', v: false }, { label: 'Continue Anyway', v: true, primary: true }]);
            if (ok) { sessionStorage.setItem(GUEST, '1'); enterGuest(); } else $('a-user').focus();
        };
        function enterGuest() { $('auth').hidden = true; updateUserUI(); }
        function updateUserUI() {
            const g = !Cloud.user, b = $('ts-so');
            b.innerHTML = `<i class="fa-solid ${g ? 'fa-right-to-bracket' : 'fa-right-from-bracket'}"></i>`;
            b.setAttribute('aria-label', g ? 'Sign in' : 'Sign out'); b.title = g ? 'Sign in or create an account' : 'Sign out';
            $('c-who').textContent = g ? 'Guest · saved on this device only' : 'Signed in as ' + Cloud.user.username;
            setStatus(Cloud.status); syncPanel();
        }
        async function enterAccount() {
            showBoot('Loading your data…'); Cloud.reconciled = false;
            for (;;) {
                try { await reconcile(await Cloud.api('/api/data')); Cloud.reconciled = true; break; }
                catch (e) {
                    if (e.status === 401) { Cloud.user = null; Cloud.token = null; updateUserUI(); showAuth('Your session has expired. Please sign in again.'); return; }
                    const c = await dlg('Couldn’t load your cloud data', 'Your data on this device is safe. You can retry, or keep working offline and retry later from the status badge.',
                        [{ label: 'Work offline', v: 'off' }, { label: 'Retry', v: 'retry', primary: true }]);
                    if (c !== 'retry') break;
                }
            }
            applyAll(); $('auth').hidden = true; updateUserUI();
            if (Cloud.reconciled) { setStatus('saved'); if (Cloud.dirty.size || Cloud.pdirty.size) Cloud.schedule(300); } else setStatus('offline');
        }
        async function restore() {
            showBoot('Restoring your session…');
            try { const r = await Cloud.api('/api/session'); Cloud.user = r.user; await enterAccount(); }
            catch (e) { if (e.status === 401) showAuth(); else showAuth('Can’t reach the account server. Retry, or continue as a guest.', true); }
        }
        function sessionExpired() {
            Cloud.user = null; Cloud.token = null; Cloud.reconciled = false; updateUserUI();
            showAuth('Your session expired. Your changes are saved on this device and will sync when you sign in again.');
        }
        async function signOut() {
            showBoot('Saving your changes…');
            let ok = false; try { ok = await Cloud.flush(); } catch (e) { /* handled below */ }
            if (!ok || Cloud.dirty.size || Cloud.pdirty.size) {
                $('auth').hidden = true;
                const go = await dlg('Some changes haven’t synced', 'They’re saved on this device and will sync the next time you sign in to this account. Sign out anyway?',
                    [{ label: 'Stay signed in', v: false }, { label: 'Sign out anyway', v: true, primary: true }]);
                if (!go) return;
                showBoot('Signing out…');
            }
            let warn = false; try { await Cloud.api('/api/logout', { method: 'POST' }); } catch (e) { warn = true; }
            Cloud.user = null; Cloud.token = null; Cloud.reconciled = false; Cloud.dirty.clear(); Cloud.pdirty.clear();
            sessionStorage.removeItem(GUEST); updateUserUI();
            showAuth(warn ? 'Signed out here, but the server couldn’t be reached to end the session. It will expire on its own.' : '');
        }
        $('ts-so').addEventListener('click', () => { if (Cloud.user) signOut(); else { $('launcher').classList.remove('open'); showAuth(); } });

        // ---------- customization panel ----------
        const panel = $('cust-panel'), cbtn = $('cust-btn'), picker = $('c-picker'), hexIn = $('c-hex');
        function openPanel(o) {
            panel.hidden = !o; cbtn.setAttribute('aria-expanded', o);
            if (o) { syncPanel(); hexIn.focus(); } else cbtn.focus();
        }
        cbtn.onclick = () => openPanel(panel.hidden);
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !panel.hidden && $('ts-dialog').hidden) { e.stopPropagation(); openPanel(false); } }, true);
        document.addEventListener('click', (e) => { if (!panel.hidden && !panel.contains(e.target) && !cbtn.contains(e.target) && $('ts-dialog').hidden) openPanel(false); });
        function syncPanel() {
            picker.value = S.v.theme;
            if (document.activeElement !== hexIn) { hexIn.value = S.v.theme; hexIn.classList.remove('bad'); }
            $('c-fx').checked = S.v.interactiveBg;
            const img = S.v.bgImage, show = !!(img && curBgUrl);
            $('c-prev').hidden = !show;
            if (show) {
                $('c-thumb').style.backgroundImage = `url("${curBgUrl}")`;
                $('c-pinfo').textContent = img.kind === 'local' ? 'Stored on this device only — it won’t sync to other devices.'
                    : Cloud.user ? 'Uploaded and synced to your account.' : 'Hosted image.';
                $('c-sync').hidden = !(img.kind === 'local' && Cloud.user && remoteReady());
            } else if (img && img.kind === 'local') { $('c-prev').hidden = false; $('c-thumb').style.backgroundImage = ''; $('c-pinfo').textContent = 'The saved image is missing from this device. Upload it again or remove it.'; $('c-sync').hidden = true; }
        }
        picker.addEventListener('input', () => { hexIn.value = picker.value; hexIn.classList.remove('bad'); showErr('c-hexerr', ''); setSetting('theme', picker.value.toLowerCase()); });
        hexIn.addEventListener('input', () => {
            const n = hexNorm(hexIn.value);
            if (n) { hexIn.classList.remove('bad'); showErr('c-hexerr', ''); picker.value = n; if (n !== S.v.theme) setSetting('theme', n); }
            else { hexIn.classList.toggle('bad', hexIn.value.trim() !== ''); showErr('c-hexerr', hexIn.value.trim() ? 'Enter a color like #8B5CF6 or #85F.' : ''); }
        });
        hexIn.addEventListener('blur', () => { if (!hexNorm(hexIn.value)) { hexIn.value = S.v.theme; hexIn.classList.remove('bad'); showErr('c-hexerr', ''); } });
        $('c-fx').addEventListener('change', (e) => setSetting('interactiveBg', e.target.checked));
        $('c-upload').onclick = () => $('c-file').click();
        $('c-file').addEventListener('change', (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) handleImage(f); });
        $('c-remove').onclick = async () => { showErr('c-err', ''); try { await idb('readwrite', (s) => s.delete('current')); } catch (e) { /* ignore */ } setSetting('bgImage', null); };
        $('c-sync').onclick = async () => {
            showErr('c-err', '');
            try { const blob = await idb('readonly', (s) => s.get('current')); if (!blob) throw new Error('image missing'); const r = await uploadRemote(blob); const n = S.v.bgImage; await idb('readwrite', (s) => s.delete('current')); setSetting('bgImage', { kind: 'remote', url: r.url, w: r.w, h: r.h, bytes: r.bytes, name: n.name }); }
            catch (e) { showErr('c-err', 'Upload failed: ' + (e.message || e)); }
        };
        $('c-reset').onclick = async () => {
            const ok = await dlg('Reset customization?', 'This restores the default color, removes your background image and turns the interactive effect on. Your account and game progress are not affected.',
                [{ label: 'Cancel', v: false }, { label: 'Reset', v: true, primary: true }]);
            if (!ok) return;
            try { await idb('readwrite', (s) => s.delete('current')); } catch (e) { /* ignore */ }
            KEYS.forEach((k) => setSetting(k, DEF[k])); showErr('c-err', ''); showErr('c-hexerr', '');
        };
        async function downscale(file, max) {
            try {
                const bmp = await createImageBitmap(file);
                if (bmp.width <= max && bmp.height <= max && file.size <= 3e6) { bmp.close(); return file; }
                const k = Math.min(1, max / Math.max(bmp.width, bmp.height)), cv = document.createElement('canvas');
                cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
                cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height); bmp.close();
                const b = await new Promise((r) => cv.toBlob(r, 'image/webp', .88));
                return b && b.size < file.size ? b : file;
            } catch (e) { return file; }
        }
        async function uploadRemote(blob) {
            const fd = new FormData(); fd.append('file', blob); fd.append('upload_preset', CFG.CLOUDINARY_PRESET);
            const r = await fetch(`https://api.cloudinary.com/v1_1/${encodeURIComponent(CFG.CLOUDINARY_CLOUD)}/image/upload`, { method: 'POST', body: fd });
            const j = await r.json().catch(() => ({}));
            if (!r.ok || !j.secure_url) throw new Error((j.error && j.error.message) || 'image host rejected the upload');
            if (!okImg(j.secure_url)) throw new Error('unexpected image host');
            return { url: j.secure_url, w: j.width | 0, h: j.height | 0, bytes: j.bytes | 0 };
        }
        async function handleImage(file) {
            showErr('c-err', '');
            if (!['image/png', 'image/jpeg', 'image/webp', 'image/gif'].includes(file.type)) return showErr('c-err', 'Unsupported file. Use a PNG, JPEG, WebP or GIF image.');
            if (file.size > 10 * 1024 * 1024) return showErr('c-err', 'That image is over 10 MB. Choose a smaller one.');
            const btn = $('c-upload'), label = btn.innerHTML;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading…';
            try {
                const blob = file.type === 'image/gif' ? file : await downscale(file, 2560), name = file.name.slice(0, 80);
                if (Cloud.user && remoteReady()) {
                    const r = await uploadRemote(blob);
                    try { await idb('readwrite', (s) => s.delete('current')); } catch (e) { /* ignore */ }
                    setSetting('bgImage', { kind: 'remote', url: r.url, w: r.w, h: r.h, bytes: r.bytes, name });
                } else {
                    await idb('readwrite', (s) => s.put(blob, 'current'));
                    setSetting('bgImage', { kind: 'local', bytes: blob.size, name });
                }
            } catch (e) { showErr('c-err', 'Couldn’t save the image: ' + (e.message || e)); }
            finally { btn.disabled = false; btn.innerHTML = label; }
        }

        // ---------- lifecycle ----------
        window.addEventListener('storage', (e) => {
            if (e.key === SK) { S = loadS(); applyAll(); } else if (e.key === PK) P = LS.get(PK, {});
        });
        window.addEventListener('online', () => { if (Cloud.user && Cloud.reconciled) Cloud.flush(); });
        document.addEventListener('visibilitychange', () => { if (document.hidden && Cloud.user && Cloud.reconciled) Cloud.flush(); });

        applyAll();   // local settings are applied immediately; the cloud copy reconciles after sign-in
        if (sessionStorage.getItem(GUEST) === '1') enterGuest();
        else if (!Cloud.ready()) showAuth();
        else restore();

        return {
            onLaunch(url, blob) { let o = ''; try { o = blob ? location.origin : new URL(url).origin; } catch (e) { /* ignore */ } cur = { id: gid(url), origin: o }; },
            onClose() { cur = null; if (Cloud.user) Cloud.flush(); }
        };
    })();

</script>
</body>
</html>
