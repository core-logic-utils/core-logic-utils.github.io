                }
            },
            remove() { for (const k of a.required) localStorage.removeItem(k); }
        };
        ADAPTERS.push(a);
        return a;
    }
    // Cookie Clicker (Prox): verified from its source — saves with
    // localStorage "CookieClickerGame" (and "CookieClickerGameBeta" on beta builds).
    lsAdapter({ id: 'cookie-clicker-prox', name: 'Cookie Clicker Prox', keys: ['CookieClickerGame', 'CookieClickerGameBeta', 'CookieClickerLang'], required: ['CookieClickerGame', 'CookieClickerGameBeta'], gameUrl: 'https://core-logic-utils.github.io/utils/bggms/ckyclkr' });
    // Opt-in postMessage protocol (any game in GAMES may use it — see README).
    const pmAdapters = {};
    (typeof GAMES !== 'undefined' ? GAMES : []).forEach(g => {
        const id = 'pm-' + fnv(g.url, 2166136261);
        if (pmAdapters[g.url]) return;
        pmAdapters[g.url] = lsAdapter({ id, name: g.name, keys: ['tabspace:pm:' + id], required: ['tabspace:pm:' + id], gameUrl: g.url, pm: true });
    });
    const adapterById = id => ADAPTERS.find(a => a.id === id);
    const keyToAdapter = {};
    ADAPTERS.forEach(a => a.keys.forEach(k => { keyToAdapter[k] = a; }));

    // ---- sync bookkeeping (no secrets): tabspace:sync:v1
    function syncState() {
        const s = readJSON(LS_SYNC, {});
        s.v = 1; s.local = s.local || {}; s.acct = s.acct || {}; s.later = s.later || {};
        return s;
    }
    function acctGame(uid, gid) { const s = syncState(); return (s.acct[uid] || {})[gid] || null; }
    function markSynced(uid, gid, rev, hash) {
        const s = syncState();
        s.acct[uid] = s.acct[uid] || {};
        s.acct[uid][gid] = { rev, hash, at: Date.now() };
        s.local[gid] = { owner: uid };
        if (s.later[uid]) delete s.later[uid][gid];
        writeJSON(LS_SYNC, s);
    }
    function setLater(uid, gid, on) {
        const s = syncState(); s.later[uid] = s.later[uid] || {};
        if (on) s.later[uid][gid] = true; else delete s.later[uid][gid];
        writeJSON(LS_SYNC, s);
    }
    const isLater = (uid, gid) => !!((syncState().later[uid] || {})[gid]);

    // ------------------------------------------------------ status display
    function setGameStatus(gid, status, msg) { state.games[gid] = { status, msg: msg || '' }; renderStatus(); }
    function overall() {
        if (state.mode === 'guest') return ['local', 'Saved on this device (guest)'];
        if (state.mode !== 'account') return ['waiting', ''];
        if (state.expired) return ['failed', 'Session expired — sign in to sync'];
        if (!state.reconciled) return ['waiting', 'Waiting to synchronize'];
        const all = [state.settingsStatus, ...Object.values(state.games).map(g => g.status)];
        if (all.includes('failed')) return ['failed', 'Save failed'];
        if (all.includes('conflict')) return ['conflict', 'A save needs your choice'];
        if (all.includes('saving')) return ['saving', 'Saving…'];
        if (all.includes('waiting')) return ['waiting', 'Waiting to synchronize'];
        return ['saved', 'Saved'];
    }
    function renderStatus() {
        const [cls, text] = overall();
        const pill = $('ts-sync-pill');
        pill.classList.toggle('show', !!state.mode);
        pill.querySelector('.ts-dot').className = 'ts-dot ' + cls;
        pill.querySelector('span:last-child').textContent = text;
        if (!$('ts-panel').hidden) renderAccountSection();
    }

    // ================================================================ THEME
    const colorInput = () => $('ts-color'), hexInput = () => $('ts-hex');
    function setThemeColor(hex, { fromHex } = {}) {
        const n = TSTheme.normHex(hex);
        if (!n) return false;
        TSTheme.apply(n);
        if (typeof window.setParticleColors === 'function') window.setParticleColors(TSTheme.cssVar('--accent-rgb') || '239, 68, 68', TSTheme.cssVar('--bg-rgb') || '11, 5, 6');
        colorInput().value = n;
        if (!fromHex) hexInput().value = n;
        hexInput().setAttribute('aria-invalid', 'false'); $('ts-hex-error').textContent = '';
        document.querySelectorAll('.ts-swatch').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.color === n)));
        if (state.settings.themeColor !== n) { state.settings.themeColor = n; settingsChanged(); }
        return true;
    }

    // =========================================================== BACKGROUND
    function applyBackground() {
        const s = state.settings, layer = $('bg-image');
        let url = null;
        if (s.bgImage && s.bgImage.source === 'local' && state.localImageUrl) url = state.localImageUrl;
        else if (s.bgImage && s.bgImage.source === 'remote' && /^https:\/\//.test(s.bgImage.url || '')) url = s.bgImage.url;
        if (url) {
            layer.style.backgroundImage = 'url("' + url.replace(/["\\\n\r]/g, encodeURIComponent) + '")';
            document.body.classList.add('has-bg-image');
        } else {
            layer.style.backgroundImage = '';
            document.body.classList.remove('has-bg-image');
        }
        renderBgPreview(url);
    }
    function setInteractive(on, { silent } = {}) {
        if (typeof window.setInteractiveBackground === 'function') window.setInteractiveBackground(on);
        $('ts-bg-toggle').checked = on;
        if (!silent && state.settings.interactiveBg !== on) { state.settings.interactiveBg = on; settingsChanged(); }
    }
    async function loadLocalImage() {
        if (state.localImageUrl) { URL.revokeObjectURL(state.localImageUrl); state.localImageUrl = null; }
        try {
            const rec = await idbRun('files', 'readonly', s => s.get('bgImage'));
            if (rec && rec.blob) state.localImageUrl = URL.createObjectURL(rec.blob);
            return rec || null;
        } catch (e) { return null; }
    }
    function decodeImage(file) {
        return new Promise((res, rej) => {
            const u = URL.createObjectURL(file), img = new Image();
            img.onload = () => { URL.revokeObjectURL(u); res({ width: img.naturalWidth, height: img.naturalHeight }); };
            img.onerror = () => { URL.revokeObjectURL(u); rej(new Error('decode')); };
            img.src = u;
        });
    }
    async function handleImageFile(file) {
        const err = $('ts-bg-error'); err.textContent = '';
        if (!file) return;
        if (!IMG_TYPES[file.type]) { err.textContent = 'Unsupported file type. Please choose a PNG, JPEG, WebP, or GIF image.'; return; }
        if (file.size > MAX_IMG_BYTES) { err.textContent = 'That image is ' + fmtBytes(file.size) + '. The maximum size is 8 MB.'; return; }
        let dims;
        try { dims = await decodeImage(file); } catch (e) { err.textContent = 'This file could not be read as an image.'; return; }
        if (!dims.width || !dims.height || dims.width > 12000 || dims.height > 12000) { err.textContent = 'Image dimensions are not supported (max 12000 × 12000).'; return; }
        const meta = { name: String(file.name || 'image').slice(0, 80), type: file.type, size: file.size, width: dims.width, height: dims.height, updatedAt: Date.now() };
        try {
            await idbRun('files', 'readwrite', s => s.put({ blob: file, ...meta }, 'bgImage'));
        } catch (e) { err.textContent = 'Could not store the image on this device (storage may be full or blocked).'; return; }
        await loadLocalImage();
        state.settings.bgImage = { source: 'local', ...meta };
        applyBackground();
        settingsChanged();
        if (state.mode === 'account' && IMG_ENABLED) uploadRemoteImage(file, meta);
    }
    async function uploadRemoteImage(file, meta) {
        const status = $('ts-bg-status');
        status.textContent = 'Uploading to image host…';
        try {
            const fd = new FormData(); fd.append('file', file); fd.append('upload_preset', IMG.uploadPreset);
            const res = await fetch('https://api.cloudinary.com/v1_1/' + encodeURIComponent(IMG.cloudName) + '/image/upload', { method: 'POST', body: fd });
            const j = await res.json().catch(() => null);
            if (!res.ok || !j || typeof j.secure_url !== 'string') throw new Error((j && j.error && j.error.message) || ('HTTP ' + res.status));
            const u = new URL(j.secure_url);
            if (u.protocol !== 'https:' || u.hostname !== 'res.cloudinary.com') throw new Error('unexpected image URL');
            if (!state.settings.bgImage || state.settings.bgImage.updatedAt !== meta.updatedAt) return; // replaced meanwhile
            state.settings.bgImage = { source: 'remote', url: u.toString(), provider: 'cloudinary', width: j.width || meta.width, height: j.height || meta.height, bytes: j.bytes || meta.size, name: meta.name, updatedAt: meta.updatedAt };
            settingsChanged();
            renderBgPreview();
        } catch (e) {
            if (state.settings.bgImage && state.settings.bgImage.updatedAt === meta.updatedAt) {
                status.textContent = 'Upload failed — image saved on this device only.';
                $('ts-bg-error').textContent = 'Image upload failed (' + e.message + '). ';
                $('ts-bg-error').append(el('button', { class: 'ts-link', type: 'button', text: 'Retry upload', onclick: () => uploadRemoteImage(file, meta) }));
            }
        }
    }
    async function removeImage() {
        try { await idbRun('files', 'readwrite', s => s.delete('bgImage')); } catch (e) { /* nothing stored */ }
        if (state.localImageUrl) { URL.revokeObjectURL(state.localImageUrl); state.localImageUrl = null; }
        state.settings.bgImage = null; $('ts-bg-error').textContent = '';
        applyBackground(); settingsChanged();
    }
    function renderBgPreview(url) {
        const s = state.settings.bgImage, box = $('ts-bg-preview');
        if (url === undefined) url = s && s.source === 'local' ? state.localImageUrl : s && s.url;
        if (!s || !url) { box.hidden = true; $('ts-bg-status').textContent = ''; return; }
        box.hidden = false;
        $('ts-bg-thumb').src = url;
        $('ts-bg-name').textContent = s.name || 'Background image';
        $('ts-bg-dims').textContent = (s.width && s.height ? s.width + ' × ' + s.height + ' · ' : '') + fmtBytes(s.size || s.bytes || 0);
        $('ts-bg-status').textContent = s.source === 'remote'
            ? (state.mode === 'account' ? 'Hosted image — synced with your account' : 'Hosted image')
            : (state.mode === 'account' && IMG_ENABLED ? 'Stored on this device only (not yet uploaded)' : 'Stored on this device only — not synced to other devices or sites');
    }

    // ============================================================ SETTINGS
    let settingsTimer = null, settingsInFlight = null, localSaveTimer = null;
    function settingsChanged() {
        state.settings.updatedAt = Date.now();
        state.settings.owner = state.mode === 'account' ? state.user.uid : null;
        // Save locally right away (small JSON) so nothing is lost if the tab closes immediately.
        if (!TSTheme.save(state.settings)) toast('Could not save settings on this device (storage blocked or full).', true);
        if (state.mode === 'account' && state.reconciled) {
            state.settingsStatus = 'waiting'; renderStatus();
            clearTimeout(settingsTimer);
            settingsTimer = setTimeout(pushSettings, 1200);
        }
    }
    function cloudSettingsPayload() {
        const s = state.settings;
        return { themeColor: s.themeColor, interactiveBg: s.interactiveBg,
            bgImage: s.bgImage && s.bgImage.source === 'remote' ? { url: s.bgImage.url, provider: s.bgImage.provider || 'remote', width: s.bgImage.width || 0, height: s.bgImage.height || 0, bytes: s.bgImage.bytes || 0 } : null };
    }
    async function pushSettings() {
        clearTimeout(settingsTimer); settingsTimer = null;
        if (state.mode !== 'account' || !state.reconciled) return true;
        if (settingsInFlight) { await settingsInFlight.catch(() => {}); }
        const stamp = state.settings.updatedAt;
        state.settingsStatus = 'saving'; renderStatus();
        settingsInFlight = api('PUT', '/api/settings', { settings: cloudSettingsPayload() });
        try {
            await settingsInFlight;
            if (state.settings.updatedAt === stamp) { state.settings.syncedAt = Date.now(); TSTheme.save(state.settings); state.settingsStatus = 'saved'; }
            renderStatus(); return true;
        } catch (e) {
            state.settingsStatus = e.status === 0 ? 'waiting' : 'failed'; renderStatus();
            if (e.status === 0) scheduleRetry();
            return false;
        } finally { settingsInFlight = null; }
    }
    function applyAllSettings() {
        setThemeColor(state.settings.themeColor);
        setInteractive(state.settings.interactiveBg, { silent: true });
        applyBackground();
    }
    async function reconcileSettings(cloud) {
        const uid = state.user.uid, local = state.settings;
        const localUnsynced = local.owner === uid && local.updatedAt > (local.syncedAt || 0);
        if (!cloud || localUnsynced) {
            // No cloud settings yet (import this device's customization) or newer offline edits by this account.
            state.settings.owner = uid;
            state.reconciled = true;
            await pushSettings();
            return;
        }
        const next = { ...local, themeColor: TSTheme.normHex(cloud.themeColor) || TSTheme.DEFAULT,
            interactiveBg: typeof cloud.interactiveBg === 'boolean' ? cloud.interactiveBg : true,
            owner: uid, syncedAt: Date.now(), updatedAt: +cloud.updatedAt || Date.now() };
        if (cloud.bgImage && typeof cloud.bgImage.url === 'string') next.bgImage = { source: 'remote', ...cloud.bgImage };
        else if (local.bgImage && local.bgImage.source === 'local') next.bgImage = local.bgImage;   // keep this device's local image
        else next.bgImage = null;
        state.settings = next;
        TSTheme.save(next);
        applyAllSettings();
        state.settingsStatus = 'saved';
    }

    // ========================================================= GAME SYNC
    async function readLocalGame(a) {
        const keys = a.read();
        if (!keys) return null;
        const size = mapSize(keys);
        return { keys, size, hash: await hashMap(keys) };
    }
    function validCloudRecord(a, rec) {
        if (!rec || typeof rec !== 'object' || !rec.keys || typeof rec.keys !== 'object') return false;
        if (rec.format && rec.format !== 'localStorage-v1') return false;              // unknown future format: leave untouched
        const ks = Object.keys(rec.keys);
        return ks.length > 0 && ks.every(k => a.keys.includes(decKey(k)) && typeof rec.keys[k] === 'string')
            && ks.some(k => a.required.includes(decKey(k)));
    }
    async function writeLocalGame(a, keys, reasonForBackup) {
        const cur = a.read();
        if (cur) await addBackup(a.id, cur, reasonForBackup);   // throws if the backup can't be made
        a.write(keys);
    }
    async function reconcileGames(cloudAll) {
        const uid = state.user.uid, conflicts = [];
        for (const a of ADAPTERS) {
            const cloudRaw = cloudAll && cloudAll[a.id];
            const local = await readLocalGame(a);
            if (!local && !cloudRaw) continue;
            if (cloudRaw && !validCloudRecord(a, cloudRaw)) { setGameStatus(a.id, 'failed', 'Cloud save uses an unsupported format; left untouched.'); continue; }
            const cloud = cloudRaw ? { ...cloudRaw, hash: await hashMap(cloudRaw.keys) } : null;
            const st = acctGame(uid, a.id);
            const owner = (syncState().local[a.id] || {}).owner || null;
            try {
                if (local && local.size > MAX_GAME_BYTES) { setGameStatus(a.id, 'failed', 'Save is too large to sync (' + fmtBytes(local.size) + '). Kept on this device.'); continue; }
                if (local && cloud && local.hash === cloud.hash) { markSynced(uid, a.id, cloud.rev, cloud.hash); setGameStatus(a.id, 'saved'); continue; }
                if (!local && cloud) {   // empty device: restore account save
                    a.write(cloud.keys); markSynced(uid, a.id, cloud.rev, cloud.hash); setGameStatus(a.id, 'saved', 'Restored from your account'); continue;
                }
                if (local && !cloud) {   // account has nothing: import this device's (guest) save
                    if (owner && owner !== uid) { conflicts.push({ a, local, cloud: null, why: 'other-account' }); continue; }
                    if (st) { const s = syncState(); delete (s.acct[uid] || {})[a.id]; writeJSON(LS_SYNC, s); }  // cloud copy is gone; start at rev 0
                    await pushGame(a.id, { initial: true }); continue;
                }
                // both exist and differ
                if (st && st.hash === local.hash && cloud.rev > st.rev && owner === uid) {
                    await writeLocalGame(a, cloud.keys, 'replaced-by-newer-cloud');
                    markSynced(uid, a.id, cloud.rev, cloud.hash); setGameStatus(a.id, 'saved', 'Updated from your account'); continue;
                }
                if (st && st.rev === cloud.rev && owner === uid) { await pushGame(a.id, { initial: true }); continue; }
                if (isLater(uid, a.id)) { setGameStatus(a.id, 'conflict', 'Device and account saves differ — choose which to keep.'); continue; }
                conflicts.push({ a, local, cloud, why: st ? 'both-changed' : 'first-link' });
            } catch (e) {
                setGameStatus(a.id, 'failed', 'Could not reconcile: ' + (e.message || e));
            }
        }
        return conflicts;
    }

    const pushTimers = {};
    let retryTimer = null, retryDelay = 15000;
    function schedulePush(gid, delay = 4000) {
        if (state.mode !== 'account' || !state.reconciled || state.expired) return;
        if (isLater(state.user.uid, gid)) return;
        clearTimeout(pushTimers[gid]);
        if (!state.games[gid] || state.games[gid].status !== 'saving') setGameStatus(gid, 'waiting');
        pushTimers[gid] = setTimeout(() => { delete pushTimers[gid]; pushGame(gid); }, delay);
    }
    function scheduleRetry() {
        if (retryTimer) return;
        retryTimer = setTimeout(() => { retryTimer = null; flushAll(); }, retryDelay);
        retryDelay = Math.min(retryDelay * 2, 300000);
    }
    async function pushGame(gid, { initial, keepalive } = {}) {
        if (state.mode !== 'account' || (!state.reconciled && !initial) || state.expired) return 'skipped';
        const a = adapterById(gid); if (!a) return 'skipped';
        const uid = state.user.uid;
        if (isLater(uid, gid)) return 'skipped';
        return withLock('tabspace-sync-' + gid, async () => {
            const local = await readLocalGame(a);
            if (!local) return 'empty';   // never propagate a missing local save as a deletion
            if (local.size > MAX_GAME_BYTES) { setGameStatus(gid, 'failed', 'Save is too large to sync (' + fmtBytes(local.size) + '). Kept on this device.'); return 'too_large'; }
            const st = acctGame(uid, gid);
            if (st && st.hash === local.hash) { setGameStatus(gid, 'saved'); return 'unchanged'; }
            setGameStatus(gid, 'saving');
            try {
                const r = await api('PUT', '/api/progress/' + gid, { baseRev: st ? st.rev : 0, hash: local.hash, keys: local.keys, format: 'localStorage-v1' }, { keepalive: keepalive && local.size < 60000 });
                markSynced(uid, gid, r.rev, local.hash);
                setGameStatus(gid, 'saved'); retryDelay = 15000;
                return 'saved';
            } catch (e) {
                if (e.status === 409 && e.data && e.data.current) {
                    const cur = e.data.current;
                    if (validCloudRecord(a, cur)) {
                        const ch = await hashMap(cur.keys);
                        if (ch === local.hash) { markSynced(uid, gid, cur.rev, ch); setGameStatus(gid, 'saved'); return 'saved'; }
                        queueConflict({ a, local, cloud: { ...cur, hash: ch }, why: 'both-changed' });
                    } else setGameStatus(gid, 'failed', 'Cloud save changed to an unsupported format.');
                    return 'conflict';
                }
                if (e.status === 413) { setGameStatus(gid, 'failed', 'Save is too large to sync. Kept on this device.'); return 'too_large'; }
                if (e.status === 401) { setGameStatus(gid, 'failed', 'Session expired.'); return 'expired'; }
                setGameStatus(gid, e.status === 0 || e.status >= 500 || e.status === 429 ? 'waiting' : 'failed', e.status === 0 ? 'Offline — will retry' : 'Server error ' + e.status);
                scheduleRetry();
                return 'failed';
            }
        });
    }
    async function scanGames() {
        if (state.mode !== 'account' || !state.reconciled) return;
        const uid = state.user.uid;
        for (const a of ADAPTERS) {
            if (isLater(uid, a.id) || pushTimers[a.id]) continue;
            const local = a.read(); if (!local) continue;
            const st = acctGame(uid, a.id);
            const h = await hashMap(local);
            if (!st || st.hash !== h) schedulePush(a.id, 1500);
        }
    }
    async function flushAll({ keepalive } = {}) {
        const results = [];
        if (state.mode !== 'account' || !state.reconciled) return { ok: true, results };
        if (settingsTimer || state.settingsStatus === 'waiting' || state.settingsStatus === 'failed') results.push(await pushSettings());
        else if (settingsInFlight) results.push(await settingsInFlight.then(() => true, () => false));
        for (const gid of Object.keys(pushTimers)) clearTimeout(pushTimers[gid]), delete pushTimers[gid];
        for (const a of ADAPTERS) {
            if (!a.read()) continue;
            const r = await pushGame(a.id, { keepalive });
            results.push(r === 'saved' || r === 'unchanged' || r === 'empty' || r === 'skipped');
        }
        return { ok: results.every(Boolean), results };
    }

    // -------------------------------------------------- conflict resolution
    function queueConflict(c) {
        setGameStatus(c.a.id, 'conflict', 'Device and account saves differ — choose which to keep.');
        if (!state.pendingConflicts.some(x => x.a.id === c.a.id)) state.pendingConflicts.push(c);
        if (!state.currentGame) processConflicts();
    }
    let processing = false;
    async function processConflicts() {
        if (processing) return; processing = true;
        try { while (state.pendingConflicts.length && !state.currentGame) await resolveConflict(state.pendingConflicts.shift()); }
        finally { processing = false; }
    }
    async function resolveConflict({ a, local, cloud, why }) {
        const uid = state.user.uid;
        const body = [];
        if (why === 'other-account') body.push('This device has a ' + a.name + ' save that was last synced with a different account. Your account has no save for this game yet.');
        else body.push('This device and your account have different ' + a.name + ' saves. Tabspace can’t safely merge complete game saves, so please choose which one to use. The other one is kept as a backup.');
        body.push('This device: ' + fmtBytes(local.size) + '.');
        if (cloud) body.push('Your account: ' + fmtBytes(mapSize(cloud.keys)) + ', last saved ' + fmtTime(cloud.updatedAt) + '.');
        const buttons = [
            { label: 'Decide later', value: 'later' },
            { label: cloud ? 'Use account save' : 'Start fresh here', value: 'cloud' },
            { label: 'Use this device’s save', value: 'local', primary: true },
        ];
        const choice = await dialog({ title: 'Choose a save for ' + a.name, paragraphs: body, buttons, cancelValue: 'later' });
        try {
            if (choice === 'later') { setLater(uid, a.id, true); setGameStatus(a.id, 'conflict', 'Device and account saves differ — choose which to keep.'); return; }
            setLater(uid, a.id, false);
            if (choice === 'cloud') {
                if (cloud) { await writeLocalGame(a, cloud.keys, 'conflict-kept-account'); markSynced(uid, a.id, cloud.rev, cloud.hash); }
                else { await addBackup(a.id, local.keys, 'conflict-start-fresh'); a.remove(); const s = syncState(); s.local[a.id] = { owner: uid }; writeJSON(LS_SYNC, s); }
                setGameStatus(a.id, 'saved', cloud ? 'Using your account save (device save backed up)' : 'Device save backed up');
                toast(a.name + ': the previous device save was backed up on this device.');
            } else {
                if (cloud) await api('POST', '/api/progress/' + a.id + '/backup', { keys: cloud.keys, hash: cloud.hash, reason: 'conflict-kept-device' });
                const s = syncState(); s.acct[uid] = s.acct[uid] || {};
                s.acct[uid][a.id] = { rev: cloud ? cloud.rev : 0, hash: cloud ? cloud.hash : '', at: Date.now() };
                s.local[a.id] = { owner: uid }; writeJSON(LS_SYNC, s);
                const r = await pushGame(a.id, { initial: true });
                if (r !== 'saved') throw new Error('upload ' + r);
            }
        } catch (e) {
            setLater(uid, a.id, true);
            setGameStatus(a.id, 'failed', 'Could not apply your choice (' + (e.message || e) + '). Nothing was deleted.');
            toast('Could not apply your choice for ' + a.name + '. Both saves are unchanged.', true);
        }
    }

    // ---------------------------------------------- game hooks (from page)
    function gameOpened(url, kind) {
        let origin = null;
        try { origin = kind === 'prox' ? location.origin : new URL(url).origin; } catch (e) { /* ignore */ }
        state.currentGame = { url, kind, origin };
    }
    function gameClosed() {
        state.currentGame = null;
        scanGames();
        processConflicts();
    }
    // Same-origin (prox / blob) game documents fire "storage" events in this page.
    window.addEventListener('storage', e => {
        if (e.storageArea !== localStorage || !e.key) return;
        if (e.key === TSTheme.LS_KEY) {          // another tab changed customization
            state.settings = TSTheme.load(); applyAllSettings(); return;
        }
        const a = keyToAdapter[e.key];
        if (a) schedulePush(a.id);
    });
    // Opt-in postMessage save protocol for embedded games.
    window.addEventListener('message', e => {
        const frame = $('game-frame'), g = state.currentGame;
        if (!g || !frame || e.source !== frame.contentWindow || !g.origin || g.origin === 'null' || e.origin !== g.origin) return;
        const m = e.data;
        if (!m || typeof m !== 'object' || m.v !== 1 || typeof m.type !== 'string') return;
        const a = pmAdapters[g.url]; if (!a) return;
        const key = a.keys[0];
        if (m.type === 'tabspace:save') {
            if (typeof m.data !== 'string' || m.data.length > 1000000) return;
            try { localStorage.setItem(key, m.data); } catch (err) { return; }
            schedulePush(a.id);
        } else if (m.type === 'tabspace:load') {
            let data = null; try { data = localStorage.getItem(key); } catch (err) { /* ignore */ }
            e.source.postMessage({ type: 'tabspace:save-data', v: 1, data }, e.origin);
        }
    });
    window.addEventListener('online', () => { retryDelay = 15000; flushAll(); });
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushAll({ keepalive: true }); });
    setInterval(() => { if (state.mode === 'account' && state.reconciled) scanGames(); }, 60000);

    // ================================================================ DIALOG
    let dialogResolve = null, dialogCancel = null, dialogReturnFocus = null;
    function dialog({ title, paragraphs, buttons, cancelValue }) {
        return new Promise(resolve => {
            dialogResolve = resolve; dialogCancel = cancelValue; dialogReturnFocus = document.activeElement;
            $('ts-dialog-title').textContent = title;
            const body = $('ts-dialog-body'); body.replaceChildren(...paragraphs.map(p => el('p', { text: p })));
            const acts = $('ts-dialog-actions'); acts.replaceChildren();
            buttons.forEach(b => acts.append(el('button', { type: 'button', class: 'ts-btn ' + (b.primary ? 'ts-btn-primary' : b.danger ? 'ts-btn-danger' : ''), text: b.label, onclick: () => closeDialog(b.value) })));
            $('ts-dialog').hidden = false;
            (acts.querySelector('.ts-btn-primary') || acts.lastChild).focus();
        });
    }
    function closeDialog(v) {
        $('ts-dialog').hidden = true;
        const r = dialogResolve; dialogResolve = null;
        if (dialogReturnFocus && dialogReturnFocus.focus) dialogReturnFocus.focus();
        if (r) r(v);
    }

    // ============================================================ AUTH UI
    const MAIN_IDS = ['home', 'games-view', 'launcher', 'search-wrap', 'home-btn', 'ts-custom-btn', 'game-container', 'ts-panel'];
    function setInert(on) { MAIN_IDS.forEach(id => { const n = $(id); if (n) n.inert = on; }); }
    let authMode = 'signin';
    function showAuth(view, opts = {}) {
        closePanel();
        const ov = $('ts-auth'); ov.hidden = false; setInert(true);
        $('ts-auth-checking').hidden = view !== 'checking';
        $('ts-auth-forms').hidden = view === 'checking';
        if (view === 'checking') $('ts-auth-checking-text').textContent = opts.text || 'Checking your session…';
        const notice = $('ts-auth-notice');
        notice.hidden = !opts.notice; notice.replaceChildren();
        if (opts.notice) { notice.append(opts.notice); if (opts.retry) notice.append(' ', el('button', { class: 'ts-link', type: 'button', text: 'Retry', onclick: opts.retry })); }
        const disabled = !API;
        ['ts-username', 'ts-password', 'ts-confirm', 'ts-remember', 'ts-auth-submit', 'ts-switch-btn', 'ts-tab-signin', 'ts-tab-signup'].forEach(id => { $(id).disabled = disabled; });
        if (view !== 'checking') setTimeout(() => (disabled ? $('ts-guest-btn') : $('ts-username')).focus(), 30);
    }
    function hideAuth() { $('ts-auth').hidden = true; setInert(false); $('ts-password').value = ''; $('ts-confirm').value = ''; }
    function setAuthMode(m) {
        authMode = m;
        const up = m === 'signup';
        $('ts-tab-signin').setAttribute('aria-selected', String(!up)); $('ts-tab-signup').setAttribute('aria-selected', String(up));
        $('ts-confirm-wrap').hidden = !up;
        $('ts-password').autocomplete = up ? 'new-password' : 'current-password';
        $('ts-auth-submit').querySelector('.lbl').textContent = up ? 'Create Account' : 'Sign In';
        $('ts-switch-text').textContent = up ? 'Already have an account?' : 'New here?';
        $('ts-switch-btn').textContent = up ? 'Sign in' : 'Create an account';
        $('ts-user-hint').hidden = !up; $('ts-pass-hint').hidden = !up;
        $('ts-auth-error').textContent = '';
        ['ts-username', 'ts-password', 'ts-confirm'].forEach(id => $(id).setAttribute('aria-invalid', 'false'));
    }
    function authError(msg, fieldId) {
        $('ts-auth-error').textContent = msg;
        if (fieldId) { $(fieldId).setAttribute('aria-invalid', 'true'); $(fieldId).focus(); }
    }
    const ERR = {
        bad_username: 'Usernames must be 3–20 characters: letters, numbers, or underscores.',
        bad_password: 'Passwords must be 8–128 characters.',
        username_taken: 'That username is already taken.',
        invalid_credentials: 'Incorrect username or password.',
        rate_limited: 'Too many attempts. Please wait a few minutes and try again.',
        server_unavailable: 'The database is unavailable right now. Please try again shortly.',
        bad_database_url: 'The Firebase databaseURL in this page looks wrong (database not found).',
        network: 'Can’t reach the account database. Check your connection and try again.',
    };
    async function submitAuth(ev) {
        ev.preventDefault();
        if (!API) return;
        const u = $('ts-username').value.trim(), p = $('ts-password').value, c = $('ts-confirm').value;
        ['ts-username', 'ts-password', 'ts-confirm'].forEach(id => $(id).setAttribute('aria-invalid', 'false'));
        if (!/^[A-Za-z0-9_]{3,20}$/.test(u)) return authError(ERR.bad_username, 'ts-username');
        if (authMode === 'signup') {
            if (p.length < 8 || p.length > 128) return authError(ERR.bad_password, 'ts-password');
            if (p !== c) return authError('Passwords don’t match.', 'ts-confirm');
        } else if (!p) return authError('Enter your password.', 'ts-password');
        const btn = $('ts-auth-submit'); btn.disabled = true; btn.querySelector('.ts-spinner').hidden = false; $('ts-auth-error').textContent = '';
        const slow = setTimeout(() => { $('ts-auth-error').textContent = 'Still working… securing your password takes a moment on slower devices.'; }, 5000);
        try {
            state.cookieOk = true;
            const r = await api('POST', authMode === 'signup' ? '/api/signup' : '/api/login', { username: u, password: p, remember: $('ts-remember').checked }, { noExpire: true });
            $('ts-password').value = ''; $('ts-confirm').value = '';
            clearTimeout(slow);
            await enterAccount(r.user);
        } catch (e) {
            clearTimeout(slow);
            authError(ERR[e.code] || (e.status ? 'Something went wrong (' + e.status + '). Please try again.' : ERR.network));
        } finally { btn.disabled = false; btn.querySelector('.ts-spinner').hidden = true; }
    }

    async function enterAccount(user) {
        state.mode = 'account'; state.user = { uid: String(user.uid), username: String(user.username || '') };
        state.reconciled = false; state.expired = false; state.games = {}; state.settingsStatus = 'idle';
        try { sessionStorage.removeItem(SS_GUEST); } catch (e) { /* ignore */ }
        showAuth('checking', { text: 'Loading your data…' });
        renderSignout();
        try {
            const data = await api('GET', '/api/data', undefined, { timeout: 60000 });
            await reconcileSettings(data.settings);
            const conflicts = await reconcileGames(data.gameProgress || {});
            state.reconciled = true;
            hideAuth();
            for (const c of conflicts) await resolveConflict(c);
            if (!state.cookieOk) toast('This browser blocked local storage, so you’ll need to sign in again after reloading.', true);
            renderStatus();
        } catch (e) {
            if (state.mode !== 'account') return;
            if (e.status === 401) {                  // session no longer valid: back to sign-in, nothing local changed
                state.mode = null; state.user = null; state.vault = null; state.expired = false;
                renderSignout(); setAuthMode('signin');
                return showAuth('forms', { notice: 'Your session has expired. Please sign in again.' });
            }
            hideAuth();
            state.reconciled = false; renderStatus();
            toast('Signed in, but your cloud data couldn’t be loaded. Nothing on this device was changed. Open Customize → Sync now to retry.', true);
        }
    }
    function enterGuest() {
        state.mode = 'guest'; state.user = null; state.vault = null; state.reconciled = false;
        try { sessionStorage.setItem(SS_GUEST, '1'); } catch (e) { /* ignore */ }
        hideAuth(); renderSignout(); renderStatus(); applyBackground();
    }
    async function guestClicked() {
        const v = await dialog({
            title: 'Continue as a guest?',
            paragraphs: ['Your game progress and customization may not carry over to other copies of this website or other devices. Creating an account lets you sync your data across supported copies.'],
            buttons: [{ label: 'Go Back', value: 'back' }, { label: 'Continue Anyway', value: 'go', primary: true }],
            cancelValue: 'back'
        });
        if (v === 'go') enterGuest();
    }
    function onSessionExpired() {
        if (state.expired) return;
        state.expired = true; state.vault = null; renderStatus();
        toast('Your session expired. Sign in again to resume syncing — your changes are kept on this device.', true);
    }

    async function signOutClicked() {
        if (state.mode === 'guest') { state.mode = null; renderSignout(); setAuthMode('signin'); showAuth('forms'); return; }
        const btn = $('ts-signout-btn'); btn.disabled = true;
        try {
            TSTheme.save(state.settings);                       // local copy always kept
            let ok = true;
            if (!state.expired && state.reconciled) {
                toast('Saving your changes…');
                const r = await Promise.race([flushAll(), sleep(10000).then(() => ({ ok: false }))]);
                ok = r.ok;
            }
            if (!ok) {
                const v = await dialog({
                    title: 'Some changes haven’t synced',
                    paragraphs: ['Some customization or game progress couldn’t be saved to your account yet. It’s still saved on this device and will sync the next time you sign in here.'],
                    buttons: [{ label: 'Stay signed in', value: 'stay' }, { label: 'Sign out anyway', value: 'out', danger: true }], cancelValue: 'stay'
                });
                if (v !== 'out') return;
            }
            await api('POST', '/api/logout', {}, { noExpire: true });   // forgets the remembered sign-in on this device only
            Object.values(pushTimers).forEach(clearTimeout);
            state.mode = null; state.user = null; state.vault = null; state.reconciled = false; state.games = {};
            renderSignout(); renderStatus();
            setAuthMode('signin'); showAuth('forms');
        } finally { btn.disabled = false; }
    }
    function renderSignout() {
        const b = $('ts-signout-btn');
        b.hidden = !state.mode;
        const guest = state.mode === 'guest';
        b.setAttribute('aria-label', guest ? 'Sign in or create an account' : 'Sign out');
        b.title = guest ? 'Sign in / create account' : 'Sign out' + (state.user ? ' (' + state.user.username + ')' : '');
        b.querySelector('i').className = guest ? 'fa-solid fa-right-to-bracket' : 'fa-solid fa-right-from-bracket';
    }

    // ============================================================== PANEL
    let panelReturnFocus = null;
    function openPanel() {
        panelReturnFocus = document.activeElement;
        $('ts-panel').hidden = false; $('ts-panel-backdrop').hidden = false;
        $('ts-custom-btn').setAttribute('aria-expanded', 'true');
        renderAccountSection(); renderBgPreview();
        $('ts-panel-close').focus();
    }
    function closePanel() {
        if ($('ts-panel').hidden) return;
        $('ts-panel').hidden = true; $('ts-panel-backdrop').hidden = true;
        $('ts-custom-btn').setAttribute('aria-expanded', 'false');
        if (panelReturnFocus && panelReturnFocus.focus) panelReturnFocus.focus();
    }
    async function renderAccountSection() {
        const box = $('ts-account'); const [cls, text] = overall();
        const kids = [];
        if (state.mode === 'account') {
            kids.push(el('div', { class: 'ts-status-line' }, el('span', { class: 'ts-dot ' + cls }), el('span', { text: 'Signed in as ' + state.user.username + ' — ' + text })));
            const acts = el('div', { class: 'ts-sync-actions' });
            if (state.expired) acts.append(el('button', { type: 'button', class: 'ts-btn ts-btn-sm ts-btn-primary', text: 'Sign in again', onclick: () => { state.mode = null; setAuthMode('signin'); showAuth('forms'); } }));
            else acts.append(el('button', { type: 'button', class: 'ts-btn ts-btn-sm', text: 'Sync now', onclick: syncNow }));
            kids.push(acts);
        } else if (state.mode === 'guest') {
            kids.push(el('div', { class: 'ts-status-line' }, el('span', { class: 'ts-dot local' }), el('span', { text: 'Guest — everything is saved on this device only.' })));
            if (API) kids.push(el('div', { class: 'ts-sync-actions' }, el('button', { type: 'button', class: 'ts-btn ts-btn-sm ts-btn-primary', text: 'Sign in to sync', onclick: () => { state.mode = null; renderSignout(); setAuthMode('signin'); showAuth('forms'); } })));
        }
        const list = el('ul', { class: 'ts-games' });
        for (const a of ADAPTERS) {
            const hasLocal = !!a.read(), g = state.games[a.id];
            if (a.pm && !hasLocal && !g) continue;
            let backups = [];
            try { backups = await listBackups(a.id); } catch (e) { /* no IDB */ }
            if (!hasLocal && !g && !backups.length && a.pm) continue;
            const st = state.mode === 'account' ? (g ? g.status : (hasLocal ? 'waiting' : 'idle')) : 'local';
            const label = { saved: 'Synced', saving: 'Saving…', waiting: 'Waiting to synchronize', failed: 'Save failed', conflict: 'Needs your choice', local: hasLocal ? 'On this device' : 'No save yet', idle: 'No save yet' }[st] || st;
            const li = el('li', {}, el('div', { class: 'ts-game-top' }, el('span', { class: 'ts-dot ' + (st === 'idle' ? 'waiting' : st) }), el('span', { text: a.name }), el('span', { text: label })));
            if (g && g.msg) li.append(el('div', { class: 'ts-game-sub', text: g.msg }));
            const acts = el('div', { class: 'ts-sync-actions' });
            if (state.mode === 'account' && st === 'conflict') acts.append(el('button', { type: 'button', class: 'ts-btn ts-btn-sm ts-btn-primary', text: 'Choose save', onclick: () => resolveLater(a) }));
            if (backups.length) acts.append(el('button', { type: 'button', class: 'ts-btn ts-btn-sm', text: 'Restore backup (' + backups.length + ')', onclick: () => restoreBackup(a, backups) }));
            if (acts.childNodes.length) li.append(acts);
            list.append(li);
        }
        if (!list.childNodes.length) list.append(el('li', { text: 'Cloud saves are supported for Cookie Clicker Prox and games that use the Tabspace save protocol. No saves found on this device yet.' }));
        box.replaceChildren(...kids, list);
    }
    async function resolveLater(a) {
        if (state.currentGame) return;
        try {
            const data = await api('GET', '/api/data');
            const rec = data.gameProgress && data.gameProgress[a.id];
            const local = await readLocalGame(a);
            if (!local) { setLater(state.user.uid, a.id, false); return syncNow(); }
            const cloud = rec && validCloudRecord(a, rec) ? { ...rec, hash: await hashMap(rec.keys) } : null;
            if (cloud && cloud.hash === local.hash) { markSynced(state.user.uid, a.id, cloud.rev, cloud.hash); setGameStatus(a.id, 'saved'); return; }
            await resolveConflict({ a, local, cloud, why: cloud ? 'both-changed' : 'other-account' });
        } catch (e) { toast('Couldn’t load your account save. Try again in a moment.', true); }
    }
    async function restoreBackup(a, backups) {
        const b = backups[0];
        const v = await dialog({
            title: 'Restore ' + a.name + ' backup?',
            paragraphs: ['Restore the backup from ' + fmtTime(b.createdAt) + ' (' + fmtBytes(b.size) + ')? Your current device save will be backed up first.', 'Close the game before restoring so it doesn’t overwrite the restored save.'],
            buttons: [{ label: 'Cancel', value: 'no' }, { label: 'Restore', value: 'yes', primary: true }], cancelValue: 'no'
        });
        if (v !== 'yes') return;
        try { await writeLocalGame(a, b.keys, 'before-restore'); toast(a.name + ' backup restored.'); schedulePush(a.id, 500); renderAccountSection(); }
        catch (e) { toast('Restore failed — nothing was changed.', true); }
    }
    async function syncNow() {
        if (state.mode !== 'account') return;
        if (!state.reconciled) {
            try {
                const data = await api('GET', '/api/data');
                await reconcileSettings(data.settings);
                const conflicts = await reconcileGames(data.gameProgress || {});
                state.reconciled = true; renderStatus();
                for (const c of conflicts) await resolveConflict(c);
            } catch (e) { toast('Still can’t reach your cloud data. Your local data is safe.', true); }
            return;
        }
        const r = await flushAll();
        toast(r.ok ? 'Everything is saved to your account.' : 'Some items couldn’t be saved yet — they’ll retry automatically.', !r.ok);
    }
    async function resetCustomization() {
        const v = await dialog({
            title: 'Reset customization?',
            paragraphs: ['This restores the default theme color, removes your custom background image, and turns the interactive background back on. Your account and game progress are not affected.'],
            buttons: [{ label: 'Cancel', value: 'no' }, { label: 'Reset', value: 'yes', danger: true }], cancelValue: 'no'
        });
        if (v !== 'yes') return;
        try { await idbRun('files', 'readwrite', s => s.delete('bgImage')); } catch (e) { /* ignore */ }
        if (state.localImageUrl) { URL.revokeObjectURL(state.localImageUrl); state.localImageUrl = null; }
        const d = TSTheme.defaults();
        state.settings = { ...state.settings, themeColor: d.themeColor, interactiveBg: true, bgImage: null };
        $('ts-bg-error').textContent = '';
        applyAllSettings(); settingsChanged();
        toast('Customization reset.');
    }

    // ============================================================== WIRING
    function wire() {
        $('ts-custom-btn').addEventListener('click', () => ($('ts-panel').hidden ? openPanel() : closePanel()));
        $('ts-panel-close').addEventListener('click', closePanel);
        $('ts-panel-backdrop').addEventListener('click', closePanel);
        colorInput().addEventListener('input', e => setThemeColor(e.target.value));
        hexInput().addEventListener('input', e => {
            const v = e.target.value.trim();
            const ok = /^#?([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v);
            e.target.setAttribute('aria-invalid', String(!ok && v.length >= 4));
            $('ts-hex-error').textContent = ok || v.length < 4 ? '' : 'Enter a hex color like #ef4444 or #e44.';
            if (ok) setThemeColor(v, { fromHex: true });
        });
        hexInput().addEventListener('change', e => {
            if (!setThemeColor(e.target.value)) { e.target.setAttribute('aria-invalid', 'true'); $('ts-hex-error').textContent = 'Invalid hex color — kept ' + state.settings.themeColor + '.'; }
        });
        const sw = $('ts-swatches');
        PRESETS.forEach(c => sw.append(el('button', { type: 'button', class: 'ts-swatch', 'data-color': c, 'aria-label': 'Theme color ' + c, 'aria-pressed': 'false', style: 'background:' + c, onclick: () => setThemeColor(c) })));
        $('ts-bg-upload').addEventListener('click', () => $('ts-bg-file').click());
        $('ts-bg-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; handleImageFile(f); });
        $('ts-bg-remove').addEventListener('click', removeImage);
        $('ts-bg-toggle').addEventListener('change', e => setInteractive(e.target.checked));
        $('ts-reset').addEventListener('click', resetCustomization);
        $('ts-auth-form').addEventListener('submit', submitAuth);
        $('ts-tab-signin').addEventListener('click', () => setAuthMode('signin'));
        $('ts-tab-signup').addEventListener('click', () => setAuthMode('signup'));
        $('ts-switch-btn').addEventListener('click', () => setAuthMode(authMode === 'signup' ? 'signin' : 'signup'));
        $('ts-guest-btn').addEventListener('click', guestClicked);
        $('ts-signout-btn').addEventListener('click', e => { e.stopPropagation(); signOutClicked(); });
        // Capture phase so Escape closes our overlays without also closing the games view.
        window.addEventListener('keydown', e => {
            if (e.key !== 'Escape') return;
            if (!$('ts-dialog').hidden) { e.stopImmediatePropagation(); e.preventDefault(); closeDialog(dialogCancel); }
            else if (!$('ts-panel').hidden) { e.stopImmediatePropagation(); closePanel(); }
            else if (!$('ts-auth').hidden) { e.stopImmediatePropagation(); }
        }, true);
        // Simple focus trap for the panel and dialog.
        document.addEventListener('keydown', e => {
            if (e.key !== 'Tab') return;
            const root = !$('ts-dialog').hidden ? $('ts-dialog') : !$('ts-panel').hidden ? $('ts-panel') : !$('ts-auth').hidden ? $('ts-auth') : null;
            if (!root) return;
            const f = [...root.querySelectorAll('button, input, [tabindex]:not([tabindex="-1"])')].filter(n => !n.disabled && n.offsetParent !== null);
            if (!f.length) return;
            if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
            else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
        });
    }

    async function boot() {
        wire();
        setAuthMode('signin');
        colorInput().value = state.settings.themeColor; hexInput().value = state.settings.themeColor;
        $('ts-bg-toggle').checked = state.settings.interactiveBg;
        document.querySelectorAll('.ts-swatch').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.color === state.settings.themeColor)));
        if (window.setParticleColors) window.setParticleColors(TSTheme.cssVar('--accent-rgb') || '239, 68, 68', TSTheme.cssVar('--bg-rgb') || '11, 5, 6');
        $('ts-img-note').textContent = IMG_ENABLED
            ? 'PNG, JPEG, WebP or GIF up to 8 MB. Signed-in users’ images are uploaded to the image host and synced.'
            : 'PNG, JPEG, WebP or GIF up to 8 MB. Images are stored on this device only (no image host configured), so they don’t sync to other devices or sites.';
        const rec = await loadLocalImage();
        if (state.settings.bgImage && state.settings.bgImage.source === 'local' && !rec) state.settings.bgImage = null; // image was cleared from storage
        applyBackground();

        if (!API) {
            if (sessionStorage.getItem(SS_GUEST)) return enterGuest();
            return showAuth('forms', { notice: DB ? 'Accounts need a secure (https) page in a modern browser, so only guest mode is available here.' : 'Accounts aren’t set up on this copy of the site yet, so only guest mode is available.' });
        }
        showAuth('checking');
        const slow = setTimeout(() => { $('ts-auth-checking-text').textContent = 'Still connecting to the account database…'; }, 4000);
        try {
            const r = await api('GET', '/api/session', undefined, { timeout: 30000, noExpire: true });
            clearTimeout(slow);
            await enterAccount(r.user);
        } catch (e) {
            clearTimeout(slow);
            let guest = false; try { guest = !!sessionStorage.getItem(SS_GUEST); } catch (err) { /* ignore */ }
            if (e.status === 401) return guest ? enterGuest() : showAuth('forms');
            const msg = ERR[e.code] || ERR.network;
            if (guest) { enterGuest(); return toast(msg, true); }
            showAuth('forms', { notice: msg, retry: () => boot2() });
        }
    }
    async function boot2() {
        showAuth('checking');
        try { const r = await api('GET', '/api/session', undefined, { timeout: 30000, noExpire: true }); await enterAccount(r.user); }
        catch (e) { showAuth('forms', e.status === 401 ? {} : { notice: ERR[e.code] || ERR.network, retry: () => boot2() }); }
    }

    boot();
    return { gameOpened, gameClosed, _state: state, _adapters: ADAPTERS, _flush: flushAll };
})();
</script>
</body>
</html>
