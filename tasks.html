<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabspace</title>
    <link rel="icon" href="https://core-logic-utils.github.io/assets/tabspacelogo.png">
    <meta name="description" content="Tabspace — a streamlined productivity and organization tool.">
    <meta property="og:title" content="Tabspace">
    <meta property="og:type" content="website">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --bg: #0b0506;
        --panel: #1a0d0f;
        --panel-2: #241216;
        --border: #3a1a1f;
        --accent: #ef4444;
        --accent-dark: #b91c1c;
        --accent-glow: rgba(239, 68, 68, 0.35);
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        font-family: 'Inter', sans-serif;
        color: white;
        overflow-x: hidden;
    }

    /* ---------- Interactive background ---------- */
    #bg-canvas {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0; pointer-events: none;
    }

    /* ---------- Home screen ---------- */
    #home {
        position: relative; z-index: 1;
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        text-align: center;
        padding: 24px;
        transition: opacity .35s ease, transform .35s ease;
    }
    #home img {
        width: 150px; height: 150px; object-fit: contain;
        filter: drop-shadow(0 0 28px var(--accent-glow));
        animation: float 5s ease-in-out infinite;
    }
    #home h1 {
        margin: 18px 0 0;
        font-size: 4rem; font-weight: 700; letter-spacing: -0.02em;
        background: linear-gradient(180deg, #fff 30%, #fca5a5 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    body.games-open #home { opacity: 0; transform: scale(.97); pointer-events: none; }

    /* ---------- Search bar (top middle) ---------- */
    #search-wrap {
        position: fixed; top: 18px; left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        width: min(460px, calc(100vw - 150px));
        opacity: 0; pointer-events: none;
        transform: translateX(-50%) translateY(-8px);
        transition: opacity .3s ease, transform .3s ease;
    }
    body.games-open #search-wrap {
        opacity: 1; pointer-events: auto;
        transform: translateX(-50%);
    }
    #search-wrap i {
        position: absolute; left: 16px; top: 50%;
        transform: translateY(-50%);
        color: #a1a1aa; font-size: .9rem; pointer-events: none;
    }
    #search {
        width: 100%;
        background: rgba(26, 13, 15, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        color: white; font: inherit; font-size: .95rem;
        padding: 11px 16px 11px 42px;
        border-radius: 999px; outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    #search::placeholder { color: #8b6f73; }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* ---------- Games view ---------- */
    #games-view {
        position: fixed; inset: 0; z-index: 10;
        overflow-y: auto;
        padding: 84px 24px 110px;
        opacity: 0; pointer-events: none;
        transform: translateY(14px);
        transition: opacity .35s ease, transform .35s ease;
    }
    body.games-open #games-view { opacity: 1; pointer-events: auto; transform: none; }

    #home-btn {
        position: fixed; top: 18px; left: 18px; z-index: 60;
        display: none; align-items: center; gap: 8px;
        background: rgba(26, 13, 15, 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        color: white; font: inherit; font-size: .85rem; font-weight: 500;
        padding: 10px 14px; border-radius: 999px; cursor: pointer;
        transition: border-color .2s, background .2s;
    }
    #home-btn:hover { border-color: var(--accent); background: rgba(60, 20, 26, 0.9); }
    body.games-open #home-btn { display: flex; }

    #games-grid {
        max-width: 1400px; margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 12px;
    }
    #no-results {
        display: none; text-align: center; color: #8b6f73; margin-top: 60px;
    }

    /* Smaller game blocks */
    .game-block {
        background: var(--panel);
        border-radius: 12px;
        overflow: hidden; cursor: pointer;
        border: 1px solid var(--border);
        transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .game-block:hover {
        transform: translateY(-4px) scale(1.04);
        border-color: var(--accent);
        box-shadow: 0 10px 22px -6px rgba(0,0,0,.6), 0 0 16px var(--accent-glow);
    }
    .game-block img {
        width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
        background: var(--panel-2);
        transition: transform .35s ease;
    }
    .game-block:hover img { transform: scale(1.08); }
    .game-block p {
        margin: 0; padding: 7px 6px;
        text-align: center; font-size: .72rem; font-weight: 500; line-height: 1.25;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; min-height: 2.6em;
    }

    /* ---------- Launcher (controller button + dropdown) ---------- */
    #launcher {
        position: fixed; left: 20px; bottom: 20px; z-index: 70;
        transition: opacity .25s ease, transform .25s ease;
    }
    body.in-game #launcher { opacity: 0; pointer-events: none; transform: scale(.8); visibility: hidden; }

    #launcher-btn {
        width: 54px; height: 54px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(145deg, var(--accent), var(--accent-dark));
        color: white; font-size: 1.4rem;
        border: none; border-radius: 16px; cursor: pointer;
        box-shadow: 0 6px 18px rgba(185, 28, 28, .45);
        transition: transform .2s ease, box-shadow .2s ease;
    }
    #launcher:hover #launcher-btn, #launcher.open #launcher-btn {
        transform: translateY(-2px) scale(1.06);
        box-shadow: 0 10px 26px var(--accent-glow);
    }

    /* The menu sits directly above the button. The padding-bottom acts as a
       hover bridge so the menu doesn't vanish while the mouse crosses the gap. */
    #menu-wrap {
        position: absolute; left: 0; bottom: 100%;
        padding-bottom: 10px;
        opacity: 0; visibility: hidden;
        transform: translateY(10px) scale(.97);
        transform-origin: bottom left;
        transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    #launcher:hover #menu-wrap, #launcher.open #menu-wrap {
        opacity: 1; visibility: visible; transform: none;
    }
    #launcher.suppress #menu-wrap { opacity: 0; visibility: hidden; }

    .menu {
        min-width: 210px;
        background: rgba(26, 13, 15, 0.95);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 16px; padding: 6px;
        box-shadow: 0 18px 40px rgba(0,0,0,.6);
    }
    .menu-item {
        position: relative;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 12px; border-radius: 10px;
        font-size: .92rem; font-weight: 500;
        cursor: pointer; user-select: none;
        transition: background .15s ease;
    }
    .menu-item:hover { background: rgba(239, 68, 68, .18); }
    .menu-item .mi-icon { width: 20px; text-align: center; color: var(--accent); }
    .menu-item .mi-arrow { margin-left: auto; font-size: .7rem; color: #8b6f73; }

    /* Chat 1 / Chat 2 fly-out */
    .submenu {
        position: absolute; left: 100%; bottom: -6px;
        padding-left: 8px;
        opacity: 0; visibility: hidden;
        transform: translateX(-6px);
        transition: opacity .15s ease, transform .15s ease, visibility .15s;
    }
    .menu-item.has-sub:hover > .submenu,
    .menu-item.has-sub.sub-open > .submenu {
        opacity: 1; visibility: visible; transform: none;
    }

    /* ---------- Game player ---------- */
    #game-container {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: black; z-index: 9998; display: none;
    }
    #game-frame { border: none; width: 100vw; height: 100vh; display: block; }
    #back-btn {
        position: fixed; top: 14px; left: 14px; z-index: 9999;
        width: 42px; height: 42px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(239, 68, 68, 0.22);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(239, 68, 68, 0.35);
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        border-radius: 12px; cursor: pointer;
        transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    #back-btn:hover {
        background: rgba(239, 68, 68, 0.55);
        transform: translateX(-2px);
        box-shadow: 0 0 16px rgba(239, 68, 68, 0.35);
    }

    @media (max-width: 640px) {
        #home h1 { font-size: 2.8rem; }
        #home img { width: 110px; height: 110px; }
        #games-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
    }
</style>

<body>
    <!-- Interactive particle background -->
    <canvas id="bg-canvas"></canvas>

    <!-- Search bar (top middle) -->
    <div id="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input id="search" type="text" placeholder="Search games..." autocomplete="off" spellcheck="false">
    </div>
    <button id="home-btn" onclick="closeGamesView()"><i class="fa-solid fa-house"></i> Home</button>

    <!-- Home screen: just the name + logo -->
    <div id="home">
        <img src="https://core-logic-utils.github.io/assets/tabspacelogo.png" alt="Tabspace logo">
        <h1>Tabspace</h1>
    </div>

    <!-- Games view (filled from the GAMES list below) -->
    <div id="games-view">
        <div id="games-grid"></div>
        <p id="no-results">No games found.</p>
    </div>

    <!-- Controller button + upward dropdown (menu filled from MENU_ITEMS below) -->
    <div id="launcher">
        <div id="menu-wrap"><div class="menu" id="menu"></div></div>
        <button id="launcher-btn" aria-label="Menu"><i class="fa-solid fa-gamepad"></i></button>
    </div>

    <!-- In-page game player -->
    <div id="game-container">
        <button id="back-btn" onclick="closeGame()" aria-label="Back"><i class="fa-solid fa-arrow-left"></i></button>
        <div id="loading-text" style="display:none; color:white; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:1.5rem; font-weight:600; z-index: 9999;">Loading...</div>
        <iframe id="game-frame" allowfullscreen></iframe>
    </div>

    // ========== INTERACTIVE PARTICLE BACKGROUND ==========
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 120 };
    let animationId;
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.2 + 0.8;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = Math.random() * 25 + 8;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.color = `rgba(239, 68, 68, ${Math.random() * 0.5 + 0.25})`;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = this.color;
            ctx.fill();
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
            if (mouse.x !== null) {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    const forceX = (dx / distance) * force * this.density * 0.35;
                    const forceY = (dy / distance) * force * this.density * 0.35;
                    this.x -= forceX;
                    this.y -= forceY;
                }
            }
        }
    }
    function initParticles() {
        particles = [];
        const numberOfParticles = Math.min(Math.floor((canvas.width * canvas.height) / 9000), 140);
        for (let i = 0; i < numberOfParticles; i++) particles.push(new Particle());
    }
    function connectParticles() {
        const maxDistance = 110;
        for (let a = 0; a < particles.length; a++) {
            for (let b = a + 1; b < particles.length; b++) {
                const dx = particles[a].x - particles[b].x;
                const dy = particles[a].y - particles[b].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < maxDistance) {
                    const opacity = 1 - (distance / maxDistance);
                    ctx.strokeStyle = `rgba(239, 68, 68, ${opacity * 0.18})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
        }
    }
    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(11, 5, 6, 0.15)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        connectParticles();
        animationId = requestAnimationFrame(animate);
    }
    window.addEventListener('mousemove', (e) => { mouse.x = e.clientX; mouse.y = e.clientY; });
    window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
    window.addEventListener('resize', () => { resizeCanvas(); initParticles(); });
    resizeCanvas();
    initParticles();
    animate();

    // ========== GAME LOGIC ==========
    function launchGame(url) {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        document.body.classList.add('in-game');
        if (loading) loading.style.display = 'none';

        // clean previous blob if any
        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.removeAttribute('srcdoc');
        frame.setAttribute('data-no-proxy', 'true');
        frame.src = url;

        frame.style.display = 'block';
        container.style.display = 'block';
    }

    async function launchProxGame(url) {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        document.body.classList.add('in-game');
        container.style.display = 'block';
        frame.style.display = 'none';
        if (loading) {
            loading.style.display = 'block';
            loading.innerText = 'Loading...';
        }

        // clean previous blob
        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.removeAttribute('srcdoc');

        // KEEP the opt-out so the parent interceptor does not rewrite the blob URL
        frame.setAttribute('data-no-proxy', 'true');

        const relayBase = "https://network-aqzh.onrender.com";
        const proxyUrl = relayBase + "/api/relay?url=" + encodeURIComponent(url);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Proxy returned ' + response.status);

            const html = await response.text();

            const blob = new Blob([html], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);

            frame._blobUrl = blobUrl;
            frame.src = blobUrl;               // now protected by data-no-proxy

            frame.onload = function() {
                if (loading) loading.style.display = 'none';
                frame.style.display = 'block';
            };
        } catch (err) {
            console.error(err);
            if (loading) loading.innerText = 'Failed to load.';
        }
    }

    function closeGame() {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        container.style.display = 'none';
        document.body.classList.remove('in-game');   // controller button reappears

        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.src = '';
        frame.removeAttribute('srcdoc');
        frame.removeAttribute('data-no-proxy');
        if (loading) loading.style.display = 'none';
    }

    // Maps the "type" strings used in MENU_ITEMS / GAMES to the launch functions
    const LAUNCHERS = {
        game: launchGame,
        prox: launchProxGame,
        protected: launchProtectedGame,
        protectedProx: launchProtectedProxGame,
        altProtected: launchAltProtectedGame,
        altProtectedProx: launchAltProtectedProxGame
    };
    function launchByType(type, url) {
        const fn = LAUNCHERS[type] || launchGame;
        fn(url);
    }

    // ========== GAMES VIEW + SEARCH ==========
    const searchInput = document.getElementById('search');
    const grid = document.getElementById('games-grid');
    const noResults = document.getElementById('no-results');

    function renderGames() {
        grid.innerHTML = '';
        GAMES.forEach(g => {
            const block = document.createElement('div');
            block.className = 'game-block';
            block.dataset.name = g.name.toLowerCase();
            block.onclick = () => launchByType(g.type, g.url);

            const img = document.createElement('img');
            img.src = g.img;
            img.alt = g.name;
            img.loading = 'lazy';

            const p = document.createElement('p');
            p.textContent = g.name;

            block.append(img, p);
            grid.appendChild(block);
        });
    }

    function filterGames() {
        const q = searchInput.value.trim().toLowerCase();
        let shown = 0;
        grid.querySelectorAll('.game-block').forEach(b => {
            const match = b.dataset.name.includes(q);
            b.style.display = match ? '' : 'none';
            if (match) shown++;
        });
        noResults.style.display = shown ? 'none' : 'block';
    }

    function openGamesView() {
        document.body.classList.add('games-open');
        filterGames();
    }
    function closeGamesView() {
        document.body.classList.remove('games-open');
        searchInput.value = '';
        filterGames();
        searchInput.blur();
    }

    searchInput.addEventListener('input', () => {
        if (!document.body.classList.contains('games-open')) openGamesView();
        filterGames();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.body.classList.contains('games-open')
            && !document.body.classList.contains('in-game')) closeGamesView();
    });

    // ========== DROPDOWN MENU ==========
    const launcher = document.getElementById('launcher');
    const menuEl = document.getElementById('menu');

    function buildMenu(items, container) {
        items.forEach(item => {
            const el = document.createElement('div');
            el.className = 'menu-item';
            el.innerHTML = `<i class="mi-icon ${item.icon || 'fa-solid fa-circle'}"></i><span>${item.label}</span>`;

            if (item.children) {
                el.classList.add('has-sub');
                el.insertAdjacentHTML('beforeend', '<i class="mi-arrow fa-solid fa-chevron-right"></i>');
                const sub = document.createElement('div');
                sub.className = 'submenu';
                const inner = document.createElement('div');
                inner.className = 'menu';
                buildMenu(item.children, inner);
                sub.appendChild(inner);
                el.appendChild(sub);
                // tap support for touch screens
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.submenu')) return;
                    el.classList.toggle('sub-open');
                });
            } else {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (item.type === 'games') openGamesView();
                    else launchByType(item.type, item.url);
                    // close the menu until the mouse leaves and comes back
                    launcher.classList.remove('open');
                    launcher.classList.add('suppress');
                });
            }
            container.appendChild(el);
        });
    }

    launcher.addEventListener('mouseleave', () => launcher.classList.remove('suppress'));
    document.getElementById('launcher-btn').addEventListener('click', () => {
        launcher.classList.remove('suppress');
        launcher.classList.toggle('open');   // tap-to-toggle for touch devices
    });
    document.addEventListener('click', (e) => {
        if (!launcher.contains(e.target)) launcher.classList.remove('open');
    });

    renderGames();
    buildMenu(MENU_ITEMS, menuEl);

    // Leave confirmation
    window.addEventListener('beforeunload', function (e) {
        e.preventDefault();
        e.returnValue = '';
    });
    window.onbeforeunload = function () {
        return '';
    };
