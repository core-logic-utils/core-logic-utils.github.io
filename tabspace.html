<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabspace</title>
    <link rel="icon" href="https://core-logic-utils.github.io/assets/tabspacelogo.png">
    <meta name="description" content="Tabspace — a streamlined productivity and organization tool.">
    <meta property="og:title" content="Tabspace">
    <meta property="og:type" content="website">

<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    :root {
        --bg: #0b0506;
        --panel: #1a0d0f;
        --panel-2: #241216;
        --border: #3a1a1f;
        --accent: #ef4444;
        --accent-dark: #b91c1c;
        --accent-glow: rgba(239, 68, 68, 0.35);
        /* added: derived theme values (defaults reproduce the original colors exactly) */
        --accent-rgb: 239, 68, 68;
        --accent-dark-rgb: 185, 28, 28;
        --accent-light: #fca5a5;
        --accent-ink: #ffffff;
        --accent-text: var(--accent);
        --bg-rgb: 11, 5, 6;
        --panel-rgb: 26, 13, 15;
        --panel-hi-rgb: 60, 20, 26;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        background: var(--bg);
        font-family: 'Inter', sans-serif;
        color: white;
        overflow-x: hidden;
    }

    /* ---------- Interactive background ---------- */
    #bg-canvas {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 0; pointer-events: none;
    }

    /* ---------- Home screen ---------- */
    #home {
        position: relative; z-index: 1;
        min-height: 100vh;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        text-align: center;
        padding: 24px;
        transition: opacity .35s ease, transform .35s ease;
    }
    #home img {
        width: 150px; height: 150px; object-fit: contain;
        filter: drop-shadow(0 0 28px var(--accent-glow));
        animation: float 5s ease-in-out infinite;
    }
    #home h1 {
        margin: 18px 0 0;
        font-size: 4rem; font-weight: 700; letter-spacing: -0.02em;
        background: linear-gradient(180deg, #fff 30%, var(--accent-light) 100%);
        -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
    }
    body.games-open #home { opacity: 0; transform: scale(.97); pointer-events: none; }

    /* ---------- Search bar (top middle) ---------- */
    #search-wrap {
        position: fixed; top: 18px; left: 50%;
        transform: translateX(-50%);
        z-index: 60;
        width: min(460px, calc(100vw - 150px));
        opacity: 0; pointer-events: none;
        transform: translateX(-50%) translateY(-8px);
        transition: opacity .3s ease, transform .3s ease;
    }
    body.games-open #search-wrap {
        opacity: 1; pointer-events: auto;
        transform: translateX(-50%);
    }
    #search-wrap i {
        position: absolute; left: 16px; top: 50%;
        transform: translateY(-50%);
        color: #a1a1aa; font-size: .9rem; pointer-events: none;
    }
    #search {
        width: 100%;
        background: rgba(var(--panel-rgb), 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        color: white; font: inherit; font-size: .95rem;
        padding: 11px 16px 11px 42px;
        border-radius: 999px; outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    #search::placeholder { color: #8b6f73; }
    #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }

    /* ---------- Games view ---------- */
    #games-view {
        position: fixed; inset: 0; z-index: 10;
        overflow-y: auto;
        padding: 84px 24px 110px;
        opacity: 0; pointer-events: none;
        transform: translateY(14px);
        transition: opacity .35s ease, transform .35s ease;
    }
    body.games-open #games-view { opacity: 1; pointer-events: auto; transform: none; }

    #home-btn {
        position: fixed; top: 18px; left: 18px; z-index: 60;
        display: none; align-items: center; gap: 8px;
        background: rgba(var(--panel-rgb), 0.8);
        backdrop-filter: blur(10px);
        border: 1px solid var(--border);
        color: white; font: inherit; font-size: .85rem; font-weight: 500;
        padding: 10px 14px; border-radius: 999px; cursor: pointer;
        transition: border-color .2s, background .2s;
    }
    #home-btn:hover { border-color: var(--accent); background: rgba(var(--panel-hi-rgb), 0.9); }
    body.games-open #home-btn { display: flex; }

    #games-grid {
        max-width: 1400px; margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
        gap: 12px;
    }
    #no-results {
        display: none; text-align: center; color: #8b6f73; margin-top: 60px;
    }

    /* Smaller game blocks */
    .game-block {
        background: var(--panel);
        border-radius: 12px;
        overflow: hidden; cursor: pointer;
        border: 1px solid var(--border);
        transition: transform .25s ease, border-color .25s ease, box-shadow .25s ease;
    }
    .game-block:hover {
        transform: translateY(-4px) scale(1.04);
        border-color: var(--accent);
        box-shadow: 0 10px 22px -6px rgba(0,0,0,.6), 0 0 16px var(--accent-glow);
    }
    .game-block img {
        width: 100%; aspect-ratio: 1 / 1; object-fit: cover; display: block;
        background: var(--panel-2);
        transition: transform .35s ease;
    }
    .game-block:hover img { transform: scale(1.08); }
    .game-block p {
        margin: 0; padding: 7px 6px;
        text-align: center; font-size: .72rem; font-weight: 500; line-height: 1.25;
        display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
        overflow: hidden; min-height: 2.6em;
    }

    /* ---------- Launcher (controller button + dropdown) ---------- */
    #launcher {
        position: fixed; left: 20px; bottom: 20px; z-index: 70;
        transition: opacity .25s ease, transform .25s ease;
    }
    body.in-game #launcher { opacity: 0; pointer-events: none; transform: scale(.8); visibility: hidden; }

    #launcher-btn {
        width: 54px; height: 54px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(145deg, var(--accent), var(--accent-dark));
        color: var(--accent-ink); font-size: 1.4rem;
        border: none; border-radius: 16px; cursor: pointer;
        box-shadow: 0 6px 18px rgba(var(--accent-dark-rgb), .45);
        transition: transform .2s ease, box-shadow .2s ease;
    }
    #launcher:hover #launcher-btn, #launcher.open #launcher-btn {
        transform: translateY(-2px) scale(1.06);
        box-shadow: 0 10px 26px var(--accent-glow);
    }

    /* The menu sits directly above the button. The padding-bottom acts as a
       hover bridge so the menu doesn't vanish while the mouse crosses the gap. */
    #menu-wrap {
        position: absolute; left: 0; bottom: 100%;
        padding-bottom: 10px;
        opacity: 0; visibility: hidden;
        transform: translateY(10px) scale(.97);
        transform-origin: bottom left;
        transition: opacity .2s ease, transform .2s ease, visibility .2s;
    }
    #launcher:hover #menu-wrap, #launcher.open #menu-wrap {
        opacity: 1; visibility: visible; transform: none;
    }
    #launcher.suppress #menu-wrap { opacity: 0; visibility: hidden; }

    .menu {
        min-width: 210px;
        background: rgba(var(--panel-rgb), 0.95);
        backdrop-filter: blur(14px);
        border: 1px solid var(--border);
        border-radius: 16px; padding: 6px;
        box-shadow: 0 18px 40px rgba(0,0,0,.6);
    }
    .menu-item {
        position: relative;
        display: flex; align-items: center; gap: 12px;
        padding: 10px 12px; border-radius: 10px;
        font-size: .92rem; font-weight: 500;
        cursor: pointer; user-select: none;
        transition: background .15s ease;
    }
    .menu-item:hover { background: rgba(var(--accent-rgb), .18); }
    .menu-item .mi-icon { width: 20px; text-align: center; color: var(--accent-text); }
    .menu-item .mi-arrow { margin-left: auto; font-size: .7rem; color: #8b6f73; }

    /* Chat 1 / Chat 2 fly-out */
    .submenu {
        position: absolute; left: 100%; bottom: -6px;
        padding-left: 8px;
        opacity: 0; visibility: hidden;
        transform: translateX(-6px);
        transition: opacity .15s ease, transform .15s ease, visibility .15s;
    }
    .menu-item.has-sub:hover > .submenu,
    .menu-item.has-sub.sub-open > .submenu {
        opacity: 1; visibility: visible; transform: none;
    }

    /* ---------- Game player ---------- */
    #game-container {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        background: black; z-index: 9998; display: none;
    }
    #game-frame { border: none; width: 100vw; height: 100vh; display: block; }
    #back-btn {
        position: fixed; top: 14px; left: 14px; z-index: 9999;
        width: 42px; height: 42px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(var(--accent-rgb), 0.22);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        border: 1px solid rgba(var(--accent-rgb), 0.35);
        color: rgba(255, 255, 255, 0.9);
        font-size: 1rem;
        border-radius: 12px; cursor: pointer;
        transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    #back-btn:hover {
        background: rgba(var(--accent-rgb), 0.55);
        transform: translateX(-2px);
        box-shadow: 0 0 16px rgba(var(--accent-rgb), 0.35);
    }

    @media (max-width: 640px) {
        #home h1 { font-size: 2.8rem; }
        #home img { width: 110px; height: 110px; }
        #games-grid { grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
    }

    /* =====================================================================
       TABSPACE ACCOUNT / CUSTOMIZATION / SYNC UI  (added)
       ===================================================================== */
    #bg-image {
        position: fixed; inset: 0; z-index: 0; pointer-events: none;
        background-color: var(--bg);
        background-size: cover; background-position: center; background-repeat: no-repeat;
        display: none;
    }
    #bg-image::after { content: ""; position: absolute; inset: 0; background: rgba(var(--bg-rgb), .35); }
    body.has-bg-image #bg-image { display: block; }
    body.bg-effect-off #bg-canvas { display: none; }

    .ts-iconbtn {
        width: 42px; height: 42px; display: inline-flex; align-items: center; justify-content: center;
        background: rgba(var(--panel-rgb), 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border); color: white; border-radius: 999px; cursor: pointer;
        transition: border-color .2s, background .2s, transform .2s; font-size: 1rem;
    }
    .ts-iconbtn:hover { border-color: var(--accent); background: rgba(var(--panel-hi-rgb), 0.9); }
    .ts-iconbtn:focus-visible, .ts-btn:focus-visible, .ts-link:focus-visible, .ts-switch-input:focus-visible + .ts-switch-track,
    #ts-signout-btn:focus-visible, .ts-tabs button:focus-visible, .ts-swatch:focus-visible {
        outline: 2px solid var(--accent-text); outline-offset: 2px;
    }
    #ts-custom-btn { position: fixed; top: 18px; right: 18px; z-index: 60; }
    body.in-game #ts-custom-btn, body.in-game #ts-sync-pill { display: none; }

    #ts-sync-pill {
        position: fixed; top: 22px; right: 70px; z-index: 60;
        display: none; align-items: center; gap: 7px;
        padding: 7px 12px; border-radius: 999px; font-size: .75rem; font-weight: 500; color: #e4d4d6;
        background: rgba(var(--panel-rgb), 0.8); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
        border: 1px solid var(--border); pointer-events: none; white-space: nowrap;
    }
    @media (min-width: 900px) { #ts-sync-pill.show { display: inline-flex; } }
    .ts-dot { width: 8px; height: 8px; border-radius: 50%; background: #71717a; flex: none; }
    .ts-dot.saved { background: #22c55e; } .ts-dot.saving { background: #eab308; } .ts-dot.failed { background: #f43f5e; }
    .ts-dot.waiting { background: #a1a1aa; } .ts-dot.local { background: #60a5fa; } .ts-dot.conflict { background: #f97316; }

    /* Sign-out button next to the menu (gamepad) button */
    #ts-signout-btn {
        position: absolute; left: 62px; bottom: 9px; width: 36px; height: 36px;
        display: flex; align-items: center; justify-content: center;
        background: rgba(var(--panel-rgb), 0.95); border: 1px solid var(--border); color: #f4f4f5;
        border-radius: 11px; cursor: pointer; font-size: .9rem;
        opacity: 0; visibility: hidden; transform: translateX(-6px);
        transition: opacity .2s ease, transform .2s ease, visibility .2s, border-color .2s, background .2s;
    }
    #ts-signout-btn::before { content: ""; position: absolute; left: -12px; top: 0; width: 12px; height: 100%; }
    #ts-signout-btn:hover { border-color: var(--accent); background: rgba(var(--panel-hi-rgb), 0.95); }
    #launcher:hover #ts-signout-btn, #launcher.open #ts-signout-btn { opacity: 1; visibility: visible; transform: none; }
    #launcher.suppress #ts-signout-btn { opacity: 0; visibility: hidden; }
    #ts-signout-btn[hidden] { display: none; }

    /* Shared controls */
    .ts-btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        font: inherit; font-size: .88rem; font-weight: 600; padding: 10px 14px; border-radius: 12px;
        cursor: pointer; border: 1px solid var(--border); color: white; background: var(--panel-2);
        transition: background .2s, border-color .2s, opacity .2s, transform .15s;
    }
    .ts-btn:hover:not(:disabled) { border-color: var(--accent); }
    .ts-btn:active:not(:disabled) { transform: translateY(1px); }
    .ts-btn:disabled { opacity: .55; cursor: not-allowed; }
    .ts-btn-primary { background: linear-gradient(145deg, var(--accent), var(--accent-dark)); color: var(--accent-ink); border-color: transparent; }
    .ts-btn-primary:hover:not(:disabled) { border-color: transparent; box-shadow: 0 6px 18px var(--accent-glow); }
    .ts-btn-ghost { background: transparent; }
    .ts-btn-danger { background: rgba(244, 63, 94, .12); border-color: rgba(244, 63, 94, .4); color: #fecdd3; }
    .ts-btn-danger:hover:not(:disabled) { border-color: #f43f5e; }
    .ts-btn-sm { padding: 7px 10px; font-size: .8rem; border-radius: 10px; }
    .ts-link { background: none; border: none; color: var(--accent-text); font: inherit; font-weight: 600; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; }
    .ts-input {
        width: 100%; background: rgba(0,0,0,.25); border: 1px solid var(--border); color: white;
        font: inherit; font-size: .95rem; padding: 10px 12px; border-radius: 10px; outline: none;
        transition: border-color .2s, box-shadow .2s;
    }
    .ts-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .ts-input[aria-invalid="true"] { border-color: #f43f5e; }
    .ts-label { display: block; font-size: .8rem; font-weight: 500; color: #d4c4c6; margin-bottom: 6px; }
    .ts-field { margin-bottom: 12px; text-align: left; }
    .ts-error { color: #fda4af; font-size: .82rem; min-height: 1.2em; margin: 4px 0 0; text-align: left; }
    .ts-hint { color: #a89597; font-size: .76rem; margin: 6px 0 0; line-height: 1.4; }
    .ts-notice { background: rgba(var(--accent-rgb), .1); border: 1px solid rgba(var(--accent-rgb), .35); color: #f1e4e5;
        border-radius: 10px; padding: 10px 12px; font-size: .82rem; margin-bottom: 12px; text-align: left; line-height: 1.45; }
    .ts-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.35); border-top-color: currentColor; animation: ts-spin .8s linear infinite; flex: none; }
    .ts-spinner[hidden] { display: none; }
    @keyframes ts-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .ts-spinner { animation-duration: 2s; } }

    /* Auth screen */
    #ts-auth {
        position: fixed; inset: 0; z-index: 10000; display: flex; align-items: center; justify-content: center;
        padding: 20px; background: rgba(var(--bg-rgb), .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
        overflow-y: auto;
    }
    #ts-auth[hidden] { display: none; }
    .ts-auth-card {
        width: min(400px, 100%); background: rgba(var(--panel-rgb), .92); border: 1px solid var(--border);
        border-radius: 20px; padding: 26px 24px 22px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.6);
    }
    .ts-auth-card > img { width: 64px; height: 64px; object-fit: contain; margin: 0 auto; filter: drop-shadow(0 0 18px var(--accent-glow)); }
    .ts-auth-card h2 { margin: 8px 0 18px; font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
    .ts-auth-state { display: flex; align-items: center; justify-content: center; gap: 10px; color: #d4c4c6; font-size: .9rem; padding: 18px 0; }
    .ts-auth-state[hidden], #ts-auth-forms[hidden] { display: none; }
    .ts-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: rgba(0,0,0,.25); border-radius: 12px; margin-bottom: 16px; }
    .ts-tabs button { font: inherit; font-size: .88rem; font-weight: 600; padding: 8px; border-radius: 9px; border: none; color: #c9b8ba; background: transparent; cursor: pointer; }
    .ts-tabs button[aria-selected="true"] { background: var(--panel-2); color: white; box-shadow: inset 0 0 0 1px var(--border); }
    #ts-auth-submit { width: 100%; margin-top: 4px; }
    .ts-remember { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: #d4c4c6; margin: 2px 0 8px; cursor: pointer; text-align: left; }
    .ts-remember input { width: 16px; height: 16px; accent-color: var(--accent); }
    .ts-switch-line { font-size: .84rem; color: #c9b8ba; margin: 14px 0 0; }
    .ts-divider { display: flex; align-items: center; gap: 10px; color: #8b6f73; font-size: .75rem; margin: 16px 0 12px; }
    .ts-divider::before, .ts-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    #ts-guest-btn { width: 100%; }

    /* Customization panel */
    #ts-panel-backdrop { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.35); }
    #ts-panel-backdrop[hidden], #ts-panel[hidden] { display: none; }
    #ts-panel {
        position: fixed; top: 70px; right: 18px; z-index: 81; width: min(380px, calc(100vw - 24px));
        max-height: calc(100vh - 90px); overflow-y: auto; overscroll-behavior: contain;
        background: rgba(var(--panel-rgb), 0.97); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 18px 40px rgba(0,0,0,.6);
        padding: 16px; animation: ts-pop .18s ease;
    }
    @keyframes ts-pop { from { opacity: 0; transform: translateY(-6px) scale(.98); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { #ts-panel { animation: none; } }
    @media (max-width: 560px) { #ts-panel { top: auto; bottom: 12px; right: 12px; left: 12px; width: auto; max-height: calc(100vh - 24px); } }
    .ts-panel-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .ts-panel-head h2 { margin: 0; font-size: 1.1rem; font-weight: 700; }
    .ts-section { border-top: 1px solid var(--border); padding: 14px 0 4px; }
    .ts-section:first-of-type { border-top: none; padding-top: 4px; }
    .ts-section h3 { margin: 0 0 10px; font-size: .78rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #bfaeb0; }
    .ts-color-row { display: flex; align-items: center; gap: 10px; }
    #ts-color { width: 48px; height: 42px; padding: 0; border: 1px solid var(--border); border-radius: 10px; background: none; cursor: pointer; flex: none; }
    #ts-color::-webkit-color-swatch-wrapper { padding: 3px; } #ts-color::-webkit-color-swatch { border: none; border-radius: 7px; }
    #ts-color::-moz-color-swatch { border: none; border-radius: 7px; }
    #ts-hex { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: lowercase; }
    .ts-swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .ts-swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid rgba(255,255,255,.18); cursor: pointer; padding: 0; }
    .ts-swatch[aria-pressed="true"] { border-color: white; }
    .ts-bg-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .ts-toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: .85rem; user-select: none; }
    .ts-switch-input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .ts-switch-track { width: 40px; height: 22px; border-radius: 999px; background: #3f3f46; position: relative; transition: background .2s; flex: none; }
    .ts-switch-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform .2s; }
    .ts-switch-input:checked + .ts-switch-track { background: var(--accent); }
    .ts-switch-input:checked + .ts-switch-track::after { transform: translateX(18px); }
    .ts-preview { margin-top: 12px; display: flex; gap: 12px; align-items: center; }
    .ts-preview[hidden] { display: none; }
    .ts-preview img { width: 96px; height: 60px; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--panel-2); }
    .ts-preview-info { flex: 1; min-width: 0; font-size: .78rem; color: #c9b8ba; line-height: 1.4; }
    .ts-preview-info strong { display: block; color: white; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ts-status-line { display: flex; align-items: center; gap: 8px; font-size: .84rem; margin-bottom: 8px; }
    .ts-sync-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .ts-games { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 8px; }
    .ts-games li { background: rgba(0,0,0,.2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; font-size: .8rem; }

    // ========== INTERACTIVE PARTICLE BACKGROUND ==========
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let mouse = { x: null, y: null, radius: 120 };
    let animationId = null;
    let bgEffectOn = false;                 // added: interactive background toggle state
    let particleRGB = '239, 68, 68';        // added: follows the theme color
    let trailRGB = '11, 5, 6';
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2.2 + 0.8;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = Math.random() * 25 + 8;
            this.vx = (Math.random() - 0.5) * 0.4;
            this.vy = (Math.random() - 0.5) * 0.4;
            this.alpha = Math.random() * 0.5 + 0.25;
        }
        draw() {
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(${particleRGB}, ${this.alpha})`;
            ctx.fill();
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.x < 0) this.x = canvas.width;
            if (this.x > canvas.width) this.x = 0;
            if (this.y < 0) this.y = canvas.height;
            if (this.y > canvas.height) this.y = 0;
            if (mouse.x !== null) {
                const dx = mouse.x - this.x;
                const dy = mouse.y - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < mouse.radius) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    const forceX = (dx / distance) * force * this.density * 0.35;
                    const forceY = (dy / distance) * force * this.density * 0.35;
                    this.x -= forceX;
                    this.y -= forceY;
                }
            }
        }
    }
    function initParticles() {
        particles = [];
        const numberOfParticles = Math.min(Math.floor((canvas.width * canvas.height) / 9000), 140);
        for (let i = 0; i < numberOfParticles; i++) particles.push(new Particle());
    }
    function connectParticles() {
        const maxDistance = 110;
        for (let a = 0; a < particles.length; a++) {
            for (let b = a + 1; b < particles.length; b++) {
                const dx = particles[a].x - particles[b].x;
                const dy = particles[a].y - particles[b].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < maxDistance) {
                    const opacity = 1 - (distance / maxDistance);
                    ctx.strokeStyle = `rgba(${particleRGB}, ${opacity * 0.18})`;
                    ctx.lineWidth = 0.8;
                    ctx.beginPath();
                    ctx.moveTo(particles[a].x, particles[a].y);
                    ctx.lineTo(particles[b].x, particles[b].y);
                    ctx.stroke();
                }
            }
        }
    }
    function animate() {
        if (!bgEffectOn) { animationId = null; return; }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = `rgba(${trailRGB}, 0.15)`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => { p.update(); p.draw(); });
        connectParticles();
        animationId = requestAnimationFrame(animate);
    }
    function onBgMouseMove(e) { mouse.x = e.clientX; mouse.y = e.clientY; }
    function onBgMouseOut() { mouse.x = null; mouse.y = null; }
    window.addEventListener('resize', () => { if (bgEffectOn) { resizeCanvas(); initParticles(); } });
    // added: turn the existing effect on/off without duplicating loops or listeners
    function setInteractiveBackground(on) {
        on = !!on;
        if (on === bgEffectOn) return;
        bgEffectOn = on;
        document.body.classList.toggle('bg-effect-off', !on);
        if (on) {
            window.addEventListener('mousemove', onBgMouseMove);
            window.addEventListener('mouseout', onBgMouseOut);
            resizeCanvas();
            initParticles();
            if (animationId === null) animationId = requestAnimationFrame(animate);
        } else {
            window.removeEventListener('mousemove', onBgMouseMove);
            window.removeEventListener('mouseout', onBgMouseOut);
            if (animationId !== null) { cancelAnimationFrame(animationId); animationId = null; }
            mouse.x = null; mouse.y = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }
    }
    function setParticleColors(accentRGB, bgRGB) {
        if (/^\d{1,3}, ?\d{1,3}, ?\d{1,3}$/.test(accentRGB)) particleRGB = accentRGB;
        if (/^\d{1,3}, ?\d{1,3}, ?\d{1,3}$/.test(bgRGB)) trailRGB = bgRGB;
    }
    resizeCanvas();
    initParticles();
    setInteractiveBackground(window.TSTheme ? TSTheme.boot.interactiveBg : true);

    // ========== GAME LOGIC ==========
    function launchGame(url) {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        document.body.classList.add('in-game');
        if (loading) loading.style.display = 'none';

        // clean previous blob if any
        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.removeAttribute('srcdoc');
        frame.setAttribute('data-no-proxy', 'true');
        if (window.TS) TS.gameOpened(url, 'direct');   // added: cloud-save hook
        frame.src = url;

        frame.style.display = 'block';
        container.style.display = 'block';
    }

    async function launchProxGame(url) {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        document.body.classList.add('in-game');
        container.style.display = 'block';
        frame.style.display = 'none';
        if (loading) {
            loading.style.display = 'block';
            loading.innerText = 'Loading...';
        }

        // clean previous blob
        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.removeAttribute('srcdoc');

        // KEEP the opt-out so the parent interceptor does not rewrite the blob URL
        frame.setAttribute('data-no-proxy', 'true');

        if (window.TS) TS.gameOpened(url, 'prox');     // added: cloud-save hook
        const relayBase = "https://network-aqzh.onrender.com";
        const proxyUrl = relayBase + "/api/relay?url=" + encodeURIComponent(url);

        try {
            const response = await fetch(proxyUrl);
            if (!response.ok) throw new Error('Proxy returned ' + response.status);

            const html = await response.text();

            const blob = new Blob([html], { type: 'text/html' });
            const blobUrl = URL.createObjectURL(blob);

            frame._blobUrl = blobUrl;
            frame.src = blobUrl;               // now protected by data-no-proxy

            frame.onload = function() {
                if (loading) loading.style.display = 'none';
                frame.style.display = 'block';
            };
        } catch (err) {
            console.error(err);
            if (loading) loading.innerText = 'Failed to load.';
        }
    }

    function closeGame() {
        const container = document.getElementById('game-container');
        const frame = document.getElementById('game-frame');
        const loading = document.getElementById('loading-text');

        container.style.display = 'none';
        document.body.classList.remove('in-game');   // controller button reappears

        if (frame._blobUrl) {
            URL.revokeObjectURL(frame._blobUrl);
            frame._blobUrl = null;
        }

        frame.src = '';
        frame.removeAttribute('srcdoc');
        frame.removeAttribute('data-no-proxy');
        if (loading) loading.style.display = 'none';
        if (window.TS) TS.gameClosed();               // added: sync any progress the game saved
    }

    function launchProtectedGame(url) {
        const password = prompt('Password:');
        if (password === 'cinnamon29') {
            launchGame(url);
        }
    }

    function launchAltProtectedGame(url) {
        const password = prompt('Password:');
        if (password === 'superwater@22') {
            launchGame(url);
        }
    }

        const password = prompt('Password:');
        if (password === 'cinnamon29') {

        }
    }

        const password = prompt('Password:');
        if (password === 'superwater@22') {
            launchProxGame(url);
        }
    }

    const LAUNCHERS = {
        game: launchGame,
        prox: launchProxGame,
        protected: launchProtectedGame,
        protectedProx: launchProtectedProxGame,
        altProtected: launchAltProtectedGame,
        altProtectedProx: launchAltProtectedProxGame
    };
    function launchByType(type, url) {
        const fn = LAUNCHERS[type] || launchGame;
        fn(url);
    }

    // ========== GAMES VIEW + SEARCH ==========
    const searchInput = document.getElementById('search');
    const grid = document.getElementById('games-grid');
    const noResults = document.getElementById('no-results');

    function renderGames() {
        grid.innerHTML = '';
        GAMES.forEach(g => {
            const block = document.createElement('div');
            block.className = 'game-block';
            block.dataset.name = g.name.toLowerCase();
            block.onclick = () => launchByType(g.type, g.url);

            const img = document.createElement('img');

            img.alt = g.name;
            img.loading = 'lazy';

            const p = document.createElement('p');
            p.textContent = g.name;

            block.append(img, p);
            grid.appendChild(block);
        });
    }

    function filterGames() {
        const q = searchInput.value.trim().toLowerCase();
        let shown = 0;
        grid.querySelectorAll('.game-block').forEach(b => {
            const match = b.dataset.name.includes(q);
            b.style.display = match ? '' : 'none';
            if (match) shown++;

        noResults.style.display = shown ? 'none' : 'block';
    }

    function openGamesView() {
        document.body.classList.add('games-open');
        filterGames();
    }
    function closeGamesView() {
        document.body.classList.remove('games-open');
        searchInput.value = '';
        filterGames();
        searchInput.blur();
    }

    searchInput.addEventListener('input', () => {
        if (!document.body.classList.contains('games-open')) openGamesView();
        filterGames();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && document.body.classList.contains('games-open')
            && !document.body.classList.contains('in-game')) closeGamesView();
    });

    // ========== DROPDOWN MENU ==========
    const launcher = document.getElementById('launcher');
    const menuEl = document.getElementById('menu');

    function buildMenu(items, container) {
        items.forEach(item => {
            const el = document.createElement('div');
            el.className = 'menu-item';
            el.innerHTML = `<i class="mi-icon ${item.icon || 'fa-solid fa-circle'}"></i><span>${item.label}</span>`;

            if (item.children) {
                el.classList.add('has-sub');
                el.insertAdjacentHTML('beforeend', '<i class="mi-arrow fa-solid fa-chevron-right"></i>');
                const sub = document.createElement('div');
                sub.className = 'submenu';
                const inner = document.createElement('div');
                inner.className = 'menu';
                buildMenu(item.children, inner);
                sub.appendChild(inner);
                el.appendChild(sub);
                // tap support for touch screens
                el.addEventListener('click', (e) => {
                    if (e.target.closest('.submenu')) return;
                    el.classList.toggle('sub-open');
                });
            } else {
                el.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (item.type === 'games') openGamesView();
                    else launchByType(item.type, item.url);
                    // close the menu until the mouse leaves and comes back
                    launcher.classList.remove('open');
                    launcher.classList.add('suppress');
                });
            }
            container.appendChild(el);
        });
    }

    launcher.addEventListener('mouseleave', () => launcher.classList.remove('suppress'));
    document.getElementById('launcher-btn').addEventListener('click', () => {
        launcher.classList.remove('suppress');
        launcher.classList.toggle('open');   // tap-to-toggle for touch devices
    });
    document.addEventListener('click', (e) => {
        if (!launcher.contains(e.target)) launcher.classList.remove('open');
    });

    renderGames();
    buildMenu(MENU_ITEMS, menuEl);

    // Leave confirmation
    window.addEventListener('beforeunload', function (e) {
        e.preventDefault();
        e.returnValue = '';
    });
    window.onbeforeunload = function () {
        return '';
    };
</script>

    async function deriveVault(lower, password) {

    async function authCall(isSignup, username, password, remember) {
        const lower = username.toLowerCase();

    async function api(method, path, body, opts = {}) {

    }

    function writeJSON(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }

            if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
            else if (k.startsWith('on')) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);

    }
    let toastTimer;
    function toast(msg, isError) {
        const t = $('ts-toast'); t.textContent = msg; t.classList.toggle('error', !!isError); t.classList.add('show');
        clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), isError ? 6000 : 3500);
    }

    // ------------------------------------------------------------- IndexedDB
    let idbP = null;
    function idb() {
        if (!idbP) idbP = new Promise((res, rej) => {
            if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
            const r = indexedDB.open('tabspace', 2);
            r.onupgradeneeded = () => {
                const d = r.result;
                if (!d.objectStoreNames.contains('files')) d.createObjectStore('files');
                if (!d.objectStoreNames.contains('session')) d.createObjectStore('session');
                if (!d.objectStoreNames.contains('backups')) d.createObjectStore('backups', { keyPath: 'id', autoIncrement: true }).createIndex('gameId', 'gameId');
            };

            r.onerror = () => rej(r.error);

    async function idbRun(store, mode, fn) {
        const d = await idb();

            const tx = d.transaction(store, mode); const st = tx.objectStore(store);
            let out; const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };

    async function addBackup(gameId, keys, reason) {
        await idbRun('backups', 'readwrite', s => s.add({ gameId, keys, size: mapSize(keys), reason, createdAt: Date.now() }));

        for (const b of list.slice(5)) await idbRun('backups', 'readwrite', s => s.delete(b.id));
    }
    async function listBackups(gameId) {
        const all = await idbRun('backups', 'readonly', s => s.index('gameId').getAll(gameId)) || [];
        return all.sort((a, b) => b.createdAt - a.createdAt);
    }

    // ------------------------------------------------------- save adapters
    // Only games whose saves genuinely live in THIS page's origin can be synced.
    // "prox" games are loaded as blob: URLs created by this page, so they share
    // this page's localStorage. Cross-origin games are isolated by the browser.
    const ADAPTERS = [];
    function lsAdapter(def) {
        const a = {
            ...def, kind: 'localStorage',
            read() {
                const m = {}; let hasRequired = false;
                for (const k of a.keys) {
                    let v = null; try { v = localStorage.getItem(k); } catch (e) { /* storage blocked */ }
                    if (v !== null) { m[encKey(k)] = v; if (a.required.includes(k)) hasRequired = true; }
                }

            write(map) {

                for (const [ek, v] of Object.entries(map)) {
